<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
<title>Wildfire Simulator</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔥</text></svg>" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div id="app">

  <header id="topbar">
    <div class="brand">
      <span class="brand-icon">🔥</span>
      <div class="brand-text">
        <h1>Wildfire Simulator</h1>
        <span class="subtitle">Interactive fire spread sandbox</span>
      </div>
    </div>

    <div class="sim-controls">
      <button id="btn-play" class="ctrl-btn primary" title="Play/Pause">
        <svg class="icon icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        <svg class="icon icon-pause" viewBox="0 0 24 24" style="display:none"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
        <span class="btn-label">Play</span>
      </button>
      <button id="btn-reset" class="ctrl-btn" title="Reset simulation">
        <svg class="icon" viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg>
        <span class="btn-label">Reset</span>
      </button>
      <button id="btn-new-terrain" class="ctrl-btn" title="Generate new terrain">
        <svg class="icon" viewBox="0 0 24 24"><path d="M3 3h8v8H3V3zm10 0h8v8h-8V3zM3 13h8v8H3v-8zm10 0h8v8h-8v-8z"/></svg>
        <span class="btn-label">New Terrain</span>
      </button>

      <div class="speed-group" role="group" aria-label="Simulation speed">
        <label class="group-label">Speed</label>
        <div class="speed-buttons" id="speed-buttons">
          <button data-speed="0.5">0.5x</button>
          <button data-speed="1" class="active">1x</button>
          <button data-speed="2">2x</button>
          <button data-speed="4">4x</button>
          <button data-speed="8">8x</button>
        </div>
      </div>

      <span id="seed-display" class="seed-display" title="Terrain seed">Seed —</span>
    </div>

    <button id="btn-menu-toggle" class="menu-toggle" title="Toggle panels" aria-label="Toggle panels">
      <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
  </header>

  <main id="layout">

    <!-- LEFT PANEL: Tools + Environment -->
    <aside id="panel-left" class="panel">
      <section class="panel-section">
        <h2>Tools</h2>
        <div class="tool-grid" id="tool-grid">
          <button class="tool-btn active" data-tool="ignite" title="Click to ignite fire">
            <span class="tool-icon">🔥</span><span>Ignite</span>
          </button>
          <button class="tool-btn" data-tool="firebreak" title="Clear a non-burnable strip">
            <span class="tool-icon">⛏️</span><span>Firebreak</span>
          </button>
          <button class="tool-btn" data-tool="water" title="Drop water to douse fire">
            <span class="tool-icon">💧</span><span>Water Drop</span>
          </button>
          <button class="tool-btn" data-tool="clear" title="Remove vegetation fuel">
            <span class="tool-icon">🌱</span><span>Clear Veg.</span>
          </button>
          <button class="tool-btn" data-tool="containment" title="Draw a containment line">
            <span class="tool-icon">🚧</span><span>Containment</span>
          </button>
        </div>
        <div class="tool-options" id="tool-options">
          <label class="slider-row">
            <span>Tool Radius</span>
            <input type="range" id="tool-radius" min="1" max="10" value="3" step="1" />
            <span class="value-badge" id="tool-radius-val">3</span>
          </label>
        </div>
      </section>

      <section class="panel-section">
        <h2>Environment</h2>
        <div class="preset-grid" id="preset-grid">
          <button class="preset-btn active" data-preset="calm">Calm Day</button>
          <button class="preset-btn" data-preset="hotdry">Hot &amp; Dry</button>
          <button class="preset-btn" data-preset="windstorm">Windstorm</button>
          <button class="preset-btn" data-preset="drought">Drought</button>
          <button class="preset-btn" data-preset="custom">Custom</button>
        </div>

        <label class="slider-row">
          <span>Dryness</span>
          <input type="range" id="dryness" min="0" max="100" value="45" />
          <span class="value-badge" id="dryness-val">45%</span>
        </label>
        <label class="slider-row">
          <span>Moisture</span>
          <input type="range" id="moisture" min="0" max="100" value="40" />
          <span class="value-badge" id="moisture-val">40%</span>
        </label>
        <label class="slider-row">
          <span>Temperature</span>
          <input type="range" id="temperature" min="0" max="100" value="50" />
          <span class="value-badge" id="temperature-val">50%</span>
        </label>
        <label class="slider-row">
          <span>Wind Strength</span>
          <input type="range" id="wind-strength" min="0" max="100" value="30" />
          <span class="value-badge" id="wind-strength-val">30%</span>
        </label>

        <div class="wind-compass-wrap">
          <span class="group-label">Wind Direction</span>
          <div id="wind-compass" title="Drag to set wind direction">
            <svg viewBox="0 0 120 120" width="100%" height="100%">
              <circle cx="60" cy="60" r="54" class="compass-ring"/>
              <text x="60" y="14" class="compass-label">N</text>
              <text x="110" y="64" class="compass-label">E</text>
              <text x="60" y="112" class="compass-label">S</text>
              <text x="10" y="64" class="compass-label">W</text>
              <g id="wind-arrow">
                <line x1="60" y1="60" x2="60" y2="20" class="arrow-shaft"/>
                <polygon points="60,10 52,26 68,26" class="arrow-head"/>
              </g>
              <circle cx="60" cy="60" r="6" class="compass-hub"/>
            </svg>
          </div>
        </div>
      </section>
    </aside>

    <!-- CENTER: Canvas -->
    <section id="canvas-wrap">
      <div id="canvas-stage">
        <canvas id="terrain-canvas"></canvas>
        <canvas id="fire-canvas"></canvas>
        <canvas id="smoke-canvas"></canvas>
        <canvas id="fx-canvas"></canvas>
      </div>

      <div id="canvas-overlay-controls">
        <div class="overlay-group" id="view-buttons" role="group" aria-label="Map overlay">
          <button data-view="terrain" class="active">Terrain</button>
          <button data-view="moisture">Moisture</button>
          <button data-view="intensity">Fire Intensity</button>
          <button data-view="fuel">Fuel</button>
        </div>
        <div class="overlay-group camera-group">
          <button id="cam-zoom-out" title="Zoom out">−</button>
          <button id="cam-zoom-in" title="Zoom in">+</button>
          <button id="cam-reset" title="Reset camera">⤾</button>
        </div>
      </div>

      <div id="wind-indicator">
        <svg viewBox="0 0 40 40" width="34" height="34">
          <g id="wind-indicator-arrow">
            <line x1="20" y1="20" x2="20" y2="6" class="mini-shaft"/>
            <polygon points="20,2 15,12 25,12" class="mini-head"/>
          </g>
        </svg>
        <span id="wind-indicator-text">N · 30%</span>
      </div>

      <div id="ignition-cursor"></div>
    </section>

    <!-- RIGHT PANEL: Stats + Log -->
    <aside id="panel-right" class="panel">
      <section class="panel-section">
        <h2>Live Statistics</h2>
        <div class="stats-grid">
          <div class="stat-tile"><span class="stat-label">Active Fires</span><span class="stat-value" id="stat-active-fires">0</span></div>
          <div class="stat-tile"><span class="stat-label">Burning Cells</span><span class="stat-value" id="stat-burning">0</span></div>
          <div class="stat-tile"><span class="stat-label">Burned Area</span><span class="stat-value" id="stat-burned-area">0</span></div>
          <div class="stat-tile"><span class="stat-label">Burned %</span><span class="stat-value" id="stat-burned-pct">0%</span></div>
          <div class="stat-tile"><span class="stat-label">Vegetation Left</span><span class="stat-value" id="stat-veg-left">100%</span></div>
          <div class="stat-tile"><span class="stat-label">Containment</span><span class="stat-value" id="stat-containment">0%</span></div>
          <div class="stat-tile wide"><span class="stat-label">Sim Time</span><span class="stat-value" id="stat-time">00:00</span></div>
          <div class="stat-tile wide"><span class="stat-label">Wind</span><span class="stat-value" id="stat-wind">N · 30%</span></div>
        </div>
      </section>

      <section class="panel-section log-section">
        <h2>Event Log</h2>
        <div id="event-log"></div>
      </section>
    </aside>

  </main>
</div>

<!-- Completion summary modal -->
<div id="summary-modal" class="modal-backdrop hidden">
  <div class="modal">
    <h2>🔥 Fire Complete</h2>
    <div class="modal-grid" id="summary-grid"></div>
    <div class="modal-actions">
      <button id="summary-close" class="ctrl-btn">Close</button>
      <button id="summary-new" class="ctrl-btn primary">New Terrain</button>
    </div>
  </div>
</div>

<script src="js/constants.js"></script>
<script src="js/noise.js"></script>
<script src="js/terrain.js"></script>
<script src="js/fire.js"></script>
<script src="js/particles.js"></script>
<script src="js/render.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
