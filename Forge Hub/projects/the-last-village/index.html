<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>THE LAST VILLAGE</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --bg-frame:#1b1826;
    --panel:#241f30;
    --panel-2:#2b2438;
    --panel-line:#3a3350;
    --ink:#ece6f5;
    --ink-dim:#a89bc2;
    --ink-faint:#766a8c;
    --amber:#e8a84f;
    --amber-dim:#c68a3a;
    --coral:#e2795a;
    --moss:#7fa06e;
    --teal:#5a92948;
    --teal2:#4c8286;
    --rival:#b4586a;
    --friend:#7fae7a;
    --shadow:0 10px 30px rgba(0,0,0,.45);
    font-size:15px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:radial-gradient(ellipse at 50% -10%, #2a2440 0%, #17141f 60%, #100e17 100%);
    color:var(--ink);
    font-family:"Iowan Old Style","Palatino Linotype","Georgia",serif;
    overflow:hidden;
  }
  .app{
    display:grid;
    grid-template-columns: 1fr 340px;
    grid-template-rows: auto 1fr auto;
    height:100vh;
    gap:10px;
    padding:12px;
  }
  header.topbar{
    grid-column:1/3;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:linear-gradient(180deg, var(--panel), var(--panel-2));
    border:1px solid var(--panel-line);
    border-radius:14px;
    padding:10px 18px;
    box-shadow:var(--shadow);
  }
  .titleblock{display:flex;align-items:baseline;gap:10px;}
  .titleblock h1{
    font-size:1.05rem;
    letter-spacing:.14em;
    margin:0;
    font-weight:600;
    color:var(--amber);
    text-transform:uppercase;
  }
  .titleblock .sub{
    font-size:.72rem;
    color:var(--ink-faint);
    font-family:"Avenir Next","Segoe UI",sans-serif;
    letter-spacing:.04em;
  }
  .stats{
    display:flex;
    gap:22px;
    font-family:"Avenir Next","Segoe UI",sans-serif;
  }
  .stat{display:flex;flex-direction:column;align-items:center;min-width:54px;}
  .stat .label{font-size:.62rem;letter-spacing:.09em;color:var(--ink-faint);text-transform:uppercase;}
  .stat .value{font-size:.98rem;color:var(--ink);font-variant-numeric:tabular-nums;margin-top:2px;}
  .stat.food .value{color:var(--moss);}
  .stat.wood .value{color:#c99a63;}

  .controls{
    display:flex;
    gap:6px;
    align-items:center;
    font-family:"Avenir Next","Segoe UI",sans-serif;
  }
  .ctrl-btn{
    background:var(--panel);
    border:1px solid var(--panel-line);
    color:var(--ink-dim);
    border-radius:8px;
    padding:6px 10px;
    font-size:.72rem;
    cursor:pointer;
    letter-spacing:.03em;
    transition:all .15s ease;
  }
  .ctrl-btn:hover{color:var(--ink);border-color:var(--amber-dim);}
  .ctrl-btn.active{background:var(--amber-dim);color:#231a0d;border-color:var(--amber-dim);font-weight:600;}
  .ctrl-btn.restart{color:var(--coral);}
  .ctrl-btn.restart:hover{background:rgba(226,121,90,.15);border-color:var(--coral);}

  .village-wrap{
    position:relative;
    border-radius:16px;
    overflow:hidden;
    border:1px solid var(--panel-line);
    box-shadow:var(--shadow);
    background:#0e0c14;
  }
  .world{
    position:absolute;
    inset:0;
    transition: background 3s ease;
  }
  .world::after{ /* vignette */
    content:"";
    position:absolute;inset:0;
    box-shadow: inset 0 0 90px 20px rgba(0,0,0,.55);
    pointer-events:none;
  }
  .poi{position:absolute;transform:translate(-50%,-50%);}
  .tree{
    position:absolute;transform:translate(-50%,-100%);
    width:0;height:0;
  }
  .tree .top{
    width:0;height:0;
    border-left:9px solid transparent;
    border-right:9px solid transparent;
    border-bottom:20px solid #3f5c3a;
    filter:brightness(var(--b,1));
  }
  .tree .top2{
    width:0;height:0;
    border-left:7px solid transparent;
    border-right:7px solid transparent;
    border-bottom:15px solid #4c6e45;
    margin-top:-11px;
    margin-left:2px;
  }
  .tree .trunk{
    width:4px;height:8px;background:#5a4632;margin:0 auto;
  }
  .lake{
    position:absolute;
    border-radius:50%;
    background:radial-gradient(ellipse at 35% 30%, #6fb3ba, #2d6169 70%, #1e474e 100%);
    box-shadow: inset 0 0 20px rgba(0,0,0,.35), 0 0 24px rgba(70,160,170,.15);
  }
  .lake .shimmer{
    position:absolute;inset:0;border-radius:50%;
    background:linear-gradient(120deg, transparent 40%, rgba(255,255,255,.14) 48%, transparent 56%);
    animation:shimmer 6s ease-in-out infinite;
  }
  @keyframes shimmer{
    0%,100%{ transform:translateX(-8%);}
    50%{ transform:translateX(8%);}
  }
  .farm-plot{
    position:absolute;
    background:repeating-linear-gradient(90deg,#5b4a30 0 4px,#6c5a3a 4px 8px);
    border-radius:3px;
    box-shadow:0 2px 4px rgba(0,0,0,.3);
  }
  .farm-plot .sprout{
    position:absolute;width:3px;height:6px;background:#7fa860;border-radius:2px 2px 0 0;
    bottom:2px;
  }
  .house{position:absolute;transform:translate(-50%,-100%);}
  .house .roof{
    width:0;height:0;
    border-left:22px solid transparent;
    border-right:22px solid transparent;
    margin:0 auto;
  }
  .house .body{
    width:34px;height:24px;
    border-radius:2px 2px 3px 3px;
    margin:0 auto;
    position:relative;
    box-shadow:0 3px 6px rgba(0,0,0,.35);
  }
  .house .door{
    position:absolute;bottom:0;left:50%;transform:translateX(-50%);
    width:8px;height:12px;background:#2c2118;border-radius:3px 3px 0 0;
  }
  .house .window{
    position:absolute;top:5px;left:6px;width:6px;height:6px;background:#f4d488;border-radius:1px;
    box-shadow:0 0 6px 1px rgba(244,212,136,.6);
  }
  .house .window.r{left:auto;right:6px;}
  .shed{position:absolute;transform:translate(-50%,-100%);}
  .shed .roof{
    width:0;height:0;
    border-left:20px solid transparent;
    border-right:20px solid transparent;
    border-bottom:14px solid #6b4a37;
  }
  .shed .body{
    width:30px;height:18px;background:#8a6a4c;border-radius:1px;margin:0 auto;
    box-shadow:0 3px 6px rgba(0,0,0,.3);
  }
  .fire{
    position:absolute;transform:translate(-50%,-50%);
    width:16px;height:16px;
  }
  .fire .glow{
    position:absolute;left:50%;top:50%;
    width:120px;height:120px;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:radial-gradient(circle, rgba(232,168,79,.35), rgba(232,168,79,0) 65%);
    pointer-events:none;
    transition:opacity 2s ease, width .6s ease, height .6s ease;
  }
  .fire .logs{
    position:absolute;left:50%;bottom:0;transform:translateX(-50%);
    width:18px;height:5px;background:#4a3423;border-radius:2px;
  }
  .fire .flame{
    position:absolute;left:50%;bottom:3px;transform:translateX(-50%);
    width:8px;height:14px;
    background:linear-gradient(180deg,#fff2c4,var(--amber) 40%,var(--coral) 90%);
    border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;
    animation:flicker 1.6s ease-in-out infinite;
    filter:drop-shadow(0 0 6px rgba(232,168,79,.8));
  }
  @keyframes flicker{
    0%,100%{ transform:translateX(-50%) scale(1,1); }
    30%{ transform:translateX(-52%) scale(.9,1.1);}
    60%{ transform:translateX(-48%) scale(1.05,.92);}
  }
  .path-svg{position:absolute;inset:0;width:100%;height:100%;}

  .villager{
    position:absolute;
    width:16px;height:16px;
    transform:translate(-50%,-50%);
    transition: left .22s linear, top .22s linear;
    cursor:pointer;
    z-index:5;
  }
  .villager .shadow{
    position:absolute;left:50%;bottom:-2px;transform:translate(-50%,0);
    width:12px;height:4px;background:rgba(0,0,0,.35);border-radius:50%;
  }
  .villager .body{
    width:11px;height:11px;
    border-radius:50%;
    margin:0 auto;
    position:relative;
    box-shadow:0 1px 3px rgba(0,0,0,.4);
  }
  .villager .head{
    width:7px;height:7px;border-radius:50%;
    position:absolute; left:50%; top:-5px; transform:translateX(-50%);
    box-shadow:0 1px 2px rgba(0,0,0,.3);
  }
  .villager .badge{
    position:absolute; top:-17px; left:50%; transform:translateX(-50%);
    font-size:10px; line-height:1;
    filter:drop-shadow(0 1px 1px rgba(0,0,0,.6));
    opacity:0; transition:opacity .3s ease;
  }
  .villager.show-badge .badge{opacity:1;}
  .villager.selected .body{
    outline:2px solid var(--amber);
    outline-offset:2px;
  }
  .villager .nametag{
    position:absolute; top:8px; left:50%; transform:translateX(-50%);
    font-size:9px; white-space:nowrap;
    background:rgba(15,12,20,.75);
    padding:1px 4px; border-radius:4px;
    color:var(--ink-dim);
    opacity:0; pointer-events:none;
    transition:opacity .15s ease;
    font-family:"Avenir Next","Segoe UI",sans-serif;
  }
  .villager:hover .nametag{opacity:1;}

  .toast{
    position:absolute; top:16px; left:50%; transform:translate(-50%,-8px);
    background:rgba(20,16,28,.88);
    border:1px solid var(--amber-dim);
    color:var(--amber);
    padding:8px 18px;
    border-radius:20px;
    font-size:.8rem;
    letter-spacing:.02em;
    box-shadow:var(--shadow);
    opacity:0;
    transition:opacity .6s ease, transform .6s ease;
    pointer-events:none;
    z-index:20;
    font-family:"Avenir Next","Segoe UI",sans-serif;
  }
  .toast.show{opacity:1; transform:translate(-50%,0);}

  .sidebar{
    display:grid;
    grid-template-rows:auto 1fr;
    gap:10px;
    min-height:0;
  }
  .panel{
    background:linear-gradient(180deg, var(--panel), var(--panel-2));
    border:1px solid var(--panel-line);
    border-radius:14px;
    box-shadow:var(--shadow);
    padding:14px 16px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    min-height:0;
  }
  .panel h2{
    margin:0 0 10px 0;
    font-size:.68rem;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--ink-faint);
    font-family:"Avenir Next","Segoe UI",sans-serif;
    font-weight:600;
    border-bottom:1px solid var(--panel-line);
    padding-bottom:8px;
  }
  .card-empty{
    color:var(--ink-faint);
    font-size:.85rem;
    font-style:italic;
    margin-top:10px;
    line-height:1.5;
  }
  .card-name{font-size:1.15rem;color:var(--amber);margin:2px 0 0 0;}
  .card-sub{font-size:.75rem;color:var(--ink-faint);font-family:"Avenir Next","Segoe UI",sans-serif;margin-bottom:10px;}
  .card-row{
    display:flex;justify-content:space-between;align-items:baseline;
    font-size:.8rem;padding:5px 0;
    border-bottom:1px dashed var(--panel-line);
    font-family:"Avenir Next","Segoe UI",sans-serif;
  }
  .card-row .k{color:var(--ink-faint);}
  .card-row .v{color:var(--ink);text-align:right;}
  .card-row .v.friend{color:var(--friend);}
  .card-row .v.rival{color:var(--rival);}
  .bars{display:flex; gap:10px; margin:8px 0 4px 0;}
  .bar-wrap{flex:1;}
  .bar-wrap .lbl{font-size:.6rem;color:var(--ink-faint);font-family:"Avenir Next","Segoe UI",sans-serif;margin-bottom:3px;letter-spacing:.05em;text-transform:uppercase;}
  .bar-track{height:5px;border-radius:3px;background:#1a1622;overflow:hidden;}
  .bar-fill{height:100%;border-radius:3px;transition:width .4s ease;}
  .desire-box{
    margin-top:10px;
    background:rgba(232,168,79,.08);
    border:1px solid rgba(232,168,79,.25);
    border-radius:8px;
    padding:8px 10px;
    font-size:.78rem;
    color:var(--amber);
    font-style:italic;
  }
  .memlist{list-style:none; margin:8px 0 0 0; padding:0; font-size:.78rem; color:var(--ink-dim); overflow-y:auto;}
  .memlist li{
    padding:6px 0; border-bottom:1px dashed var(--panel-line);
    line-height:1.35;
  }
  .memlist li:last-child{border-bottom:none;}
  .memlist .tag{color:var(--ink-faint); font-size:.68rem; margin-right:4px;}

  .chronicle-panel{overflow:hidden;}
  .chron-list{
    list-style:none; margin:0; padding:0;
    overflow-y:auto;
    font-size:.79rem;
    color:var(--ink-dim);
    line-height:1.5;
  }
  .chron-list li{
    padding:7px 2px;
    border-bottom:1px solid rgba(58,51,80,.5);
  }
  .chron-list li .day{color:var(--amber-dim); font-family:"Avenir Next","Segoe UI",sans-serif; font-size:.67rem; margin-right:6px;}
  .chron-list li:first-child{color:var(--ink);}

  .abilities-bar{
    grid-column:1/3;
    background:linear-gradient(180deg, var(--panel), var(--panel-2));
    border:1px solid var(--panel-line);
    border-radius:14px;
    box-shadow:var(--shadow);
    padding:10px 16px;
    display:flex;
    align-items:center;
    gap:12px;
  }
  .abilities-label{
    font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);
    font-family:"Avenir Next","Segoe UI",sans-serif;
    white-space:nowrap;
    padding-right:6px;
    border-right:1px solid var(--panel-line);
    margin-right:2px;
  }
  .ability-btn{
    position:relative;
    flex:1;
    background:#1e1a29;
    border:1px solid var(--panel-line);
    border-radius:10px;
    padding:9px 10px;
    cursor:pointer;
    text-align:left;
    color:var(--ink);
    transition:all .15s ease;
    overflow:hidden;
    font-family:"Avenir Next","Segoe UI",sans-serif;
  }
  .ability-btn:hover:not(:disabled){border-color:var(--amber-dim); transform:translateY(-1px);}
  .ability-btn:disabled{cursor:default; opacity:.55;}
  .ability-btn .icon{font-size:1rem;margin-right:6px;}
  .ability-btn .name{font-size:.8rem;font-weight:600;}
  .ability-btn .desc{display:block;font-size:.66rem;color:var(--ink-faint);margin-top:2px;}
  .ability-btn .cd{
    position:absolute; right:8px; top:8px;
    font-size:.66rem; color:var(--amber-dim);
    font-variant-numeric:tabular-nums;
  }
  .ability-btn .fillbar{
    position:absolute; left:0; bottom:0; height:2px;
    background:var(--amber); width:0%;
    transition:width .3s linear;
  }

  ::-webkit-scrollbar{width:7px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:#3a3350;border-radius:4px;}

  @media (max-width: 880px){
    .app{grid-template-columns:1fr;}
    header.topbar{grid-column:1;flex-wrap:wrap;gap:8px;}
    .abilities-bar{grid-column:1;flex-wrap:wrap;}
    .sidebar{grid-template-rows:auto auto;}
  }
</style>
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="titleblock">
      <h1>The Last Village</h1>
      <span class="sub">a small world, watching itself</span>
    </div>
    <div class="stats">
      <div class="stat"><span class="label">Day</span><span class="value" id="stat-day">1</span></div>
      <div class="stat"><span class="label">Time</span><span class="value" id="stat-time">06:00</span></div>
      <div class="stat food"><span class="label">Food</span><span class="value" id="stat-food">0</span></div>
      <div class="stat wood"><span class="label">Wood</span><span class="value" id="stat-wood">0</span></div>
      <div class="stat"><span class="label">Villagers</span><span class="value" id="stat-pop">12</span></div>
    </div>
    <div class="controls">
      <button class="ctrl-btn" id="btn-pause">Pause</button>
      <button class="ctrl-btn" id="btn-speed1">1×</button>
      <button class="ctrl-btn" id="btn-speed2">2×</button>
      <button class="ctrl-btn" id="btn-speed4">4×</button>
      <button class="ctrl-btn restart" id="btn-restart">Restart World</button>
    </div>
  </header>

  <div class="village-wrap">
    <div class="world" id="world">
      <svg class="path-svg" id="path-svg"></svg>
      <!-- poi and villager nodes injected by JS -->
    </div>
    <div class="toast" id="toast"></div>
  </div>

  <div class="sidebar">
    <div class="panel" id="card-panel">
      <h2>Villager</h2>
      <div id="card-body"><div class="card-empty">Click a villager to learn their story.</div></div>
    </div>
    <div class="panel chronicle-panel">
      <h2>Village Chronicle</h2>
      <ul class="chron-list" id="chron-list"></ul>
    </div>
  </div>

  <div class="abilities-bar">
    <span class="abilities-label">Observer's<br>Influence</span>
    <button class="ability-btn" id="ab-bless">
      <div class="fillbar" id="ab-bless-fill"></div>
      <span class="cd" id="ab-bless-cd"></span>
      <span class="icon">🌾</span><span class="name">Bless Harvest</span>
      <span class="desc">Food production surges for a while.</span>
    </button>
    <button class="ability-btn" id="ab-fire">
      <div class="fillbar" id="ab-fire-fill"></div>
      <span class="cd" id="ab-fire-cd"></span>
      <span class="icon">🔥</span><span class="name">Light the Fire</span>
      <span class="desc">Villagers feel drawn to gather.</span>
    </button>
    <button class="ability-btn" id="ab-gather">
      <div class="fillbar" id="ab-gather-fill"></div>
      <span class="cd" id="ab-gather-cd"></span>
      <span class="icon">🔔</span><span class="name">Call Gathering</span>
      <span class="desc">Word spreads — come to the fire.</span>
    </button>
    <button class="ability-btn" id="ab-quiet">
      <div class="fillbar" id="ab-quiet-fill"></div>
      <span class="cd" id="ab-quiet-cd"></span>
      <span class="icon">🌙</span><span class="name">Quiet Night</span>
      <span class="desc">Rest comes easier tonight.</span>
    </button>
  </div>

</div>

<script>
(function(){
"use strict";

/* ---------------------------------------------------------------------
   WORLD LAYOUT (percent coordinates within the village view)
--------------------------------------------------------------------- */
const POI = {
  fire:      {x:50, y:49},
  house0:    {x:15, y:20},
  house1:    {x:33, y:11},
  house2:    {x:68, y:12},
  house3:    {x:86, y:28},
  house4:    {x:20, y:66},
  lake:      {x:81, y:75},
  forest:    {x:8,  y:48},
  farm:      {x:61, y:82},
  workshop:  {x:38, y:78},
  storage:   {x:35, y:41},
  open1:     {x:55, y:60},
  open2:     {x:46, y:26},
};
const HOUSES = ['house0','house1','house2','house3','house4'];
const HOUSE_COLORS = ['#8a6a52','#7a5e6f','#5f7a6c','#7c6a4a','#6a5c7a'];
const ROOF_COLORS  = ['#5a4132','#4a3444','#3a4c40','#4c4230','#3f3648'];

/* ---------------------------------------------------------------------
   GENERATION DATA
--------------------------------------------------------------------- */
const NAME_POOL = ['Rowan','Mira','Tomas','Elin','Sana','Bram','Odele','Finn','Wren','Talia','Corin','Juno','Kestrel','Lior','Sable','Perrin'];
const OCC_POOL = ['Farmer','Forager','Fisher','Builder','Weaver','Cook','Herbalist','Storyteller','Elder','Guard'];
const DESIRE_POOL = [
  "to be trusted with something important",
  "to find one true friend",
  "to see what lies beyond the forest",
  "to be remembered fondly",
  "to master their craft",
  "to mend an old rivalry",
  "to live a quiet, peaceful life",
  "to protect the village from harm",
  "to be forgiven for something small",
  "to belong, truly, somewhere",
];
const PERSONALITIES = {
  Warm:    {generosity:.80,sociability:.80,temper:.20,diligence:.50,curiosity:.40, color:'#e0a85e'},
  Grumpy:  {generosity:.30,sociability:.30,temper:.80,diligence:.50,curiosity:.30, color:'#8a7360'},
  Curious: {generosity:.50,sociability:.60,temper:.30,diligence:.40,curiosity:.90, color:'#7fae9a'},
  Shy:     {generosity:.50,sociability:.25,temper:.25,diligence:.60,curiosity:.40, color:'#9a8fbf'},
  Bold:    {generosity:.40,sociability:.60,temper:.60,diligence:.70,curiosity:.60, color:'#c4715a'},
  Wise:    {generosity:.70,sociability:.50,temper:.15,diligence:.60,curiosity:.50, color:'#7396a8'},
  Playful: {generosity:.60,sociability:.85,temper:.35,diligence:.30,curiosity:.70, color:'#d4a06a'},
  Stoic:   {generosity:.40,sociability:.30,temper:.15,diligence:.80,curiosity:.30, color:'#6f7a8a'},
};
const WORK_LOCATION = {
  Farmer:'farm', Forager:'forest', Fisher:'lake', Builder:'workshop',
  Weaver:'workshop', Cook:'storage', Herbalist:'forest', Storyteller:'fire',
  Elder:'storage', Guard:'workshop'
};

function rand(a,b){ return a + Math.random()*(b-a); }
function ri(a,b){ return Math.floor(rand(a,b+1)); }
function choice(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
function clamp(v,lo,hi){ return Math.max(lo,Math.min(hi,v)); }
function dist(ax,ay,bx,by){ return Math.hypot(ax-bx, ay-by); }
function pad(n){ return n<10 ? '0'+n : ''+n; }

/* ---------------------------------------------------------------------
   STATE
--------------------------------------------------------------------- */

/* ---------------------------------------------------------------------
   VILLAGER FACTORY
--------------------------------------------------------------------- */
function makeVillager(id, name, homeIdx){
  const pArchName = choice(Object.keys(PERSONALITIES));
  const trait = PERSONALITIES[pArchName];
  const occ = choice(OCC_POOL);
  const home = 'house'+homeIdx;
  const pos = POI[home];
  return {
    id, name,
    age: ri(17,68),
    archetype: pArchName,
    trait,
    occupation: occ,
    home,
    x: pos.x + rand(-2,2), y: pos.y + rand(-1,1),
    targetX: pos.x, targetY: pos.y,
    arrived: true,
    state: 'sleep',
    locationKey: home,
    stateTimer: ri(30,90),
    interactedIds: new Set(),
    energy: rand(55,85),
    hunger: rand(10,35),
    moodValue: rand(48,66),
    desire: choice(DESIRE_POOL),
    rel: {}, // id -> {aff, friendLogged, rivalLogged}
    memories: [],
    ateThisMeal:false,
  };
}

function getRel(v, otherId){
  if(!v.rel[otherId]) v.rel[otherId] = {aff:0, friendLogged:false, rivalLogged:false};
  return v.rel[otherId];
}
function changeAff(a,b,delta){
  const ra = getRel(a,b.id), rb = getRel(b,a.id);
  ra.aff = clamp(ra.aff+delta, -100, 100);
  rb.aff = clamp(rb.aff+delta, -100, 100);
}
function addMemory(v, text){
  v.memories.unshift({day, time: timeString(), text});
  if(v.memories.length>6) v.memories.pop();
}
function logEvent(text){
  chronicle.unshift({day, time: timeString(), text});
  if(chronicle.length>50) chronicle.pop();
  renderChronicle();
}

function timeString(){
  const h = Math.floor(minutes/60)%24, m = Math.floor(minutes%60);
  return pad(h)+':'+pad(m);
}
function isNight(){ const h=Math.floor(minutes/60)%24; return h>=22 || h<6; }
function isEvening(){ const h=Math.floor(minutes/60)%24; return h>=18 && h<22; }
function isDay(){ const h=Math.floor(minutes/60)%24; return h>=6 && h<18; }
function phaseName(){
  const h=Math.floor(minutes/60)%24;
  if(h>=5&&h<8) return 'Dawn';
  if(h>=8&&h<18) return 'Day';
  if(h>=18&&h<21) return 'Evening';
  return 'Night';
}

   WORLD GENERATION
--------------------------------------------------------------------- */
function newVillage(){
  villagers = [];
  const names = shuffle(NAME_POOL).slice(0,12);
  for(let i=0;i<12;i++){
    villagers.push(makeVillager(i, names[i], i%5));
  }
  day = 1; minutes = 6*60;
  food = 22; wood = 14;
  chronicle = [];
  selectedId = null;
  loggedEveningCheckDay = 0;
  buffs = {harvest:false,harvestT:0,fireAttract:false,fireAttractT:0,energyRegen:false,energyRegenT:0};
  cooldowns = {bless:0,fire:0,gather:0,quiet:0};
  buildWorldDOM();
  renderChronicle();
  logEvent('A new village has begun.');
  showToast('A new village has begun.');
  updateCard();
  updateStats();
}

function lighten(hex){
  const c = hex.replace('#','');
  const r = Math.min(255, parseInt(c.substr(0,2),16)+40);
  const g = Math.min(255, parseInt(c.substr(2,2),16)+40);
  const b = Math.min(255, parseInt(c.substr(4,2),16)+40);
  return `rgb(${r},${g},${b})`;
}

function highlightSelection(){
  document.querySelectorAll('.villager').forEach(el=>el.classList.remove('selected'));
  if(selectedId!=null){
    const el = document.getElementById('v-'+selectedId);
    if(el) el.classList.add('selected');
  }
}

/* ---------------------------------------------------------------------
   DECISION MAKING
--------------------------------------------------------------------- */
function bestFriendOf(v){
  let best=null, bestAff=15;
  for(const oid in v.rel){
    if(v.rel[oid].aff>bestAff){ bestAff=v.rel[oid].aff; best=oid; }
  }
  return best;
}
function worstRivalOf(v){
  let worst=null, worstAff=-15;
  for(const oid in v.rel){
    if(v.rel[oid].aff<worstAff){ worstAff=v.rel[oid].aff; worst=oid; }
  }
  return worst;
}

function chooseNextAction(v){
  v.interactedIds = new Set();
  v.ateThisMeal = false;

  const scores = {};
  const t = v.trait;
  scores.sleep  = (v.energy<35?70:v.energy<55?18:0) + (isNight()?55:0) + (v.energy<15?100:0);
  scores.eat    = (v.hunger>65?70:v.hunger>40?24:0) * (food>0?1:0.05);
  scores.work   = (isDay()?45:6) + t.diligence*30 - (v.hunger>78?25:0) - (v.energy<25?45:0);
  scores.fire   = (isEvening()?55:isNight()?22:12) + t.sociability*25 + (buffs.fireAttract?35:0) - t.temper*8;
  scores.visit  = t.sociability*20 + (bestFriendOf(v)?22:0) - (v.energy<20?30:0);
  scores.wander = 12 + t.curiosity*22;

  if(v.energy<10){ scores.work=0; scores.fire=Math.min(scores.fire,8); scores.wander=Math.min(scores.wander,5); }
  if(v.hunger>92){ scores.eat += 60; }

  let total=0; const entries=[];
  for(const k in scores){
    const val = Math.max(0.5, scores[k]);
    entries.push([k,val]); total+=val;
  }
  let roll = Math.random()*total, picked='wander';
  for(const [k,val] of entries){ roll-=val; if(roll<=0){ picked=k; break; } }

  applyChosenState(v, picked);
}

function applyChosenState(v, state){
  v.state = state;
  v.arrived = false;
  switch(state){
    case 'sleep': {
      const p = POI[v.home];
      v.targetX = p.x+rand(-3,3); v.targetY = p.y+rand(-1,1);
      v.locationKey = v.home;
      v.pendingDuration = ri(280,420);
      break;
    }
    case 'eat': {
      const p = POI.storage;
      v.targetX = p.x+rand(-3,3); v.targetY = p.y+rand(-2,2);
      v.locationKey = 'storage';
      v.pendingDuration = ri(20,30);
      break;
    }
    case 'work': {
      const key = WORK_LOCATION[v.occupation] || 'farm';
      const p = POI[key];
      v.targetX = p.x+rand(-4,4); v.targetY = p.y+rand(-3,3);
      v.locationKey = key;
      v.pendingDuration = ri(90,190);
      break;
    }
    case 'fire': {
      const p = POI.fire;
      const ang = rand(0,Math.PI*2), r=rand(3,7);
      v.targetX = p.x+Math.cos(ang)*r; v.targetY = p.y+Math.sin(ang)*r*0.7;
      v.locationKey = 'fire';
      v.pendingDuration = ri(40,100);
      break;
    }
    case 'visit': {
      const fid = bestFriendOf(v);
      const target = fid!=null ? villagers.find(x=>x.id==fid) : choice(villagers.filter(x=>x.id!==v.id));
      const p = POI[target.home];
      v.targetX = p.x+rand(-3,3); v.targetY = p.y+rand(-1,1);
      v.locationKey = target.home;
      v.visitTargetId = target.id;
      v.pendingDuration = ri(35,75);
      break;
    }
    case 'wander': {
      const spots = [POI.lake, POI.forest, POI.open1, POI.open2, POI.farm];
      const p = choice(spots);
      v.targetX = p.x+rand(-4,4); v.targetY = p.y+rand(-4,4);
      v.locationKey = (p===POI.lake)?'lake':(p===POI.forest?'forest':'open');
      v.pendingDuration = ri(20,45);
      break;
    }
  }
}

/* ---------------------------------------------------------------------
   MOVEMENT + STATE TICKING
--------------------------------------------------------------------- */
function moveTowards(v, stepPct){
  const d = dist(v.x,v.y,v.targetX,v.targetY);
  if(d < 1.2){
    v.x=v.targetX; v.y=v.targetY;
    onArrive(v);
  } else {
    const nx = v.x + (v.targetX-v.x)/d*stepPct;
    const ny = v.y + (v.targetY-v.y)/d*stepPct;
    v.x=nx; v.y=ny;
  }
}

function onArrive(v){
  v.arrived = true;
  v.stateTimer = v.pendingDuration;
  handleArrivalInteractions(v);
}

function placeName(key){
  if(key==='fire') return 'fire';
  if(key==='lake') return 'lake';
  if(key==='forest') return 'forest edge';
  if(key==='farm') return 'farm';
  if(key==='workshop') return 'workshop';
  if(key==='storage') return 'storage hut';
  if(key && key.startsWith('house')) return 'house';
  return 'village';
}

function handleArrivalInteractions(v){
  if(v.state==='sleep') return;
  const others = villagers.filter(o=>
    o.id!==v.id && o.arrived && o.locationKey===v.locationKey &&
    o.state!=='sleep' && !v.interactedIds.has(o.id)
  );
  if(others.length===0) return;
  const other = choice(others);
  v.interactedIds.add(other.id);
  other.interactedIds.add(v.id);
  socialize(v, other, v.locationKey);
}

function socialize(a,b,ctx){
  const ra = getRel(a,b.id);
  let friendChance = 0.58 + (a.trait.sociability+b.trait.sociability)/2*0.28 - (a.trait.temper+b.trait.temper)/2*0.32;
  if(ra.aff < -30) friendChance -= 0.22;
  if(ra.aff > 40) friendChance += 0.12;
  friendChance = clamp(friendChance, 0.08, 0.94);

  if(Math.random() > friendChance){
    // conflict
    const severity = 5 + (a.trait.temper+b.trait.temper)*9 + rand(0,10);
    changeAff(a,b,-severity);
    a.moodValue -= 10; b.moodValue -= 10;
    const rb = getRel(a,b.id);
    if(severity>17){
      a.state='argue'; b.state='argue';
      logEvent(`${a.name} and ${b.name} argued near the ${placeName(ctx)}.`);
      addMemory(a, `${b.name} argued with me near the ${placeName(ctx)}.`);
      addMemory(b, `${a.name} argued with me near the ${placeName(ctx)}.`);
    }
    if(rb.aff<=-55 && !rb.friendLoggedRival){
      getRel(a,b.id).rivalLogged = true; getRel(b,a.id).rivalLogged = true;
      logEvent(`${a.name} and ${b.name} have grown into rivals.`);
    }
  } else {
    // bonding
    const gain = 6 + (a.trait.generosity+b.trait.generosity)*8 + rand(0,6);
    changeAff(a,b,gain);
    a.moodValue += 7; b.moodValue += 7;
    const rb = getRel(a,b.id);
    if(rb.aff>=60 && !rb.friendLogged){
      getRel(a,b.id).friendLogged = true; getRel(b,a.id).friendLogged = true;
      logEvent(`${a.name} and ${b.name} have become close friends.`);
      addMemory(a, `${b.name} and I have grown close.`);
      addMemory(b, `${a.name} and I have grown close.`);
    }
  }

  // chance to share food if one is quite hungry and other is generous
  const hungryOne = a.hunger>b.hunger ? a : b;
  const otherOne = hungryOne===a ? b : a;
  if(hungryOne.hunger>72 && otherOne.trait.generosity>0.55 && Math.random()<0.4){
    if(food>0){ food--; }
    hungryOne.hunger = Math.max(10, hungryOne.hunger-40);
    hungryOne.moodValue += 10; otherOne.moodValue += 6;
    changeAff(otherOne, hungryOne, 10);
    logEvent(`${otherOne.name} shared a meal with ${hungryOne.name}.`);
    addMemory(hungryOne, `${otherOne.name} helped me when I was hungry.`);
    addMemory(otherOne, `I shared what I had with ${hungryOne.name}.`);
  }
}

function completeWork(v){
  const mult = buffs.harvest ? 2.4 : 1;
  const hrs = v.pendingDuration/60;
  if(['Farmer','Forager','Fisher','Cook'].includes(v.occupation)){
    const amt = Math.round(hrs*2.1*mult*(0.7+v.trait.diligence*0.6));
    food += amt;
  } else if(['Builder','Weaver','Guard'].includes(v.occupation)){
    const amt = Math.round(hrs*1.5*(0.7+v.trait.diligence*0.6));
    wood += amt;
  } else if(v.occupation==='Herbalist'){
    food += Math.round(hrs*1*mult);
    v.moodValue += 3;
  } else if(v.occupation==='Storyteller' || v.occupation==='Elder'){
    // boosts mood of anyone nearby at fire
    villagers.forEach(o=>{
      if(o.id!==v.id && o.locationKey==='fire' && o.arrived) o.moodValue = clamp(o.moodValue+4,0,100);
    });
  }
}

function updateVillager(v, dt){
  if(!v.arrived){
    const stepPct = 0.85 * speed;
    moveTowards(v, stepPct);
    return;
  }
  // stationed
  v.hunger = clamp(v.hunger + dt*0.018*(v.state!=='eat'?1:0.2), 0, 100);

  switch(v.state){
    case 'sleep': {
      const regen = buffs.energyRegen ? 0.62 : 0.32;
      v.energy = clamp(v.energy + dt*regen, 0, 100);
      if(v.energy>=96) v.stateTimer = 0;
      break;
    }
    case 'eat': {
      if(!v.ateThisMeal){
        v.ateThisMeal = true;
        if(food>0){ food--; } else { v.moodValue -= 4; }
      }
      if(food>=0) v.hunger = clamp(v.hunger - dt*3.2, 0, 100);
      v.energy = clamp(v.energy+dt*0.05,0,100);
      break;
    }
    case 'work': {
      v.energy = clamp(v.energy - dt*0.13, 0, 100);
      break;
    }
    case 'fire': {
      v.moodValue = clamp(v.moodValue + dt*0.16, 0, 100);
      v.energy = clamp(v.energy - dt*0.02, 0, 100);
      break;
    }
    case 'visit': {
      v.moodValue = clamp(v.moodValue + dt*0.10, 0, 100);
      v.energy = clamp(v.energy - dt*0.03, 0, 100);
      break;
    }
    case 'wander': {
      v.energy = clamp(v.energy - dt*0.05, 0, 100);
      v.moodValue = clamp(v.moodValue + dt*0.06*v.trait.curiosity, 0, 100);
      break;
    }
    case 'argue': {
      v.moodValue = clamp(v.moodValue - dt*0.2, 0, 100);
      break;
    }
  }

  v.stateTimer -= dt;
  if(v.stateTimer<=0){
    if(v.state==='work') completeWork(v);
    if(v.state==='wander' && v.locationKey==='lake' && Math.random()<0.5){
      addMemory(v, 'I enjoyed sitting beside the lake.');
    }
    chooseNextAction(v);
  }
}

/* mood drift toward personality baseline, daily */
function dailyMoodDrift(){
  villagers.forEach(v=>{
    const baseline = 45 + v.trait.generosity*10 + (1-v.trait.temper)*10;
    v.moodValue += (baseline - v.moodValue)*0.15;
    v.moodValue = clamp(v.moodValue,0,100);
  });
}

/* ---------------------------------------------------------------------
   WORLD EVENTS
--------------------------------------------------------------------- */
function maybeWorldEvent(){
  if(Math.random()>0.38) return;
  const pool = ['rain','shortage','harvest','argument','celebration','illness','lostSupplies','visitor','nightSky'];
  const pick = choice(pool);
  switch(pick){
    case 'rain':
      villagers.forEach(v=>v.moodValue=clamp(v.moodValue-4,0,100));
      logEvent('Heavy rain soaks the village.');
      break;
    case 'shortage':
      food = Math.max(0, food-ri(4,9));
      logEvent('A food shortage worries the village.');
      break;
    case 'harvest':
      food += ri(10,18);
      logEvent('An unusually good harvest fills the storage hut.');
      break;
    case 'argument': {
      const a = choice(villagers), b=choice(villagers.filter(x=>x.id!==a.id));
      changeAff(a,b,-ri(10,20));
      a.moodValue-=8; b.moodValue-=8;
      logEvent(`${a.name} and ${b.name} argued over something small.`);
      addMemory(a, `I argued with ${b.name}.`); addMemory(b, `I argued with ${a.name}.`);
      break;
    }
    case 'celebration': {
      const present = villagers.filter(v=>v.locationKey==='fire' && v.arrived);
      if(present.length>=2){
        present.forEach(p=>{ p.moodValue=clamp(p.moodValue+12,0,100);
          present.forEach(q=>{ if(q.id!==p.id) changeAff(p,q,6); });
        });
        logEvent('The village gathered for a small celebration by the fire.');
      } else {
        villagers.forEach(v=>v.moodValue=clamp(v.moodValue+5,0,100));
        logEvent("A quiet celebration lifted the village's spirits.");
      }
      break;
    }
    case 'illness': {
      const v = choice(villagers);
      v.energy = Math.max(5, v.energy-35);
      v.hunger = clamp(v.hunger+15,0,100);
      logEvent(`${v.name} caught a chill and rests uneasily.`);
      addMemory(v, 'I felt unwell and had to rest.');
      break;
    }
    case 'lostSupplies':
      wood = Math.max(0, wood-ri(3,7));
      logEvent('Some supplies went missing near the storage hut.');
      break;
    case 'visitor':
      villagers.forEach(v=>v.moodValue=clamp(v.moodValue+3,0,100));
      logEvent('A quiet traveler passed through, sharing news of distant lands.');
      break;
    case 'nightSky':
      if(isNight()){
        villagers.forEach(v=>v.moodValue=clamp(v.moodValue+6,0,100));
        logEvent('The night sky glimmered, and villagers paused to admire it.');
      }
      break;
  }
}

function checkEveningAlone(){
  const h = minutes/60;
  if(h>=20 && h<20.3 && loggedEveningCheckDay!==day){
    loggedEveningCheckDay = day;
    const atFire = villagers.filter(v=>v.locationKey==='fire' && v.arrived && v.state==='fire');
    if(atFire.length===1){
      logEvent(`${atFire[0].name} spent the evening alone near the fire.`);
      addMemory(atFire[0], 'I sat alone by the fire tonight.');
    }
  }
}

/* ---------------------------------------------------------------------
   MAIN LOOP
--------------------------------------------------------------------- */
function advanceTime(dtMinutes){
  minutes += dtMinutes;
  while(minutes>=1440){
    minutes-=1440; day++;
    dailyMoodDrift();
    maybeWorldEvent();
    if(day%10===0){ logEvent(`The village survived its ${day}th day.`); }
  }
}

function gameTick(){
  if(paused) return;
  const dt = GAME_MIN_PER_TICK*speed;
  advanceTime(dt);
  villagers.forEach(v=>updateVillager(v,dt));
  checkEveningAlone();
  renderFrame();
}

function renderFrame(){
  villagers.forEach(v=>{
    const el = document.getElementById('v-'+v.id);
    if(!el) return;
    el.style.left = v.x+'%';
    el.style.top = v.y+'%';
    const badge = el.querySelector('.badge');
    const icon = activityIcon(v);
    if(icon){ badge.textContent=icon; el.classList.add('show-badge'); }
    else { el.classList.remove('show-badge'); }
  });
  updateStats();
  updateLighting();
  if(selectedId!=null) updateCard();
}

function activityIcon(v){
  switch(v.state){
    case 'sleep': return '💤';
    case 'eat': return '🍞';
    case 'work': {
      const k = WORK_LOCATION[v.occupation];
      if(k==='lake') return '🎣';
      if(k==='workshop') return '🔨';
      if(k==='fire') return '📖';
      return '🌾';
    }
    case 'fire': return '🔥';
    case 'visit': return '👋';
    case 'wander': return '';
    case 'argue': return '💢';
  }
  return '';
}

/* ---------------------------------------------------------------------
   ABILITIES
--------------------------------------------------------------------- */
function activateAbility(key){
  if(cooldowns[key]>0) return;
  cooldowns[key] = CD_MAX[key];
  if(key==='bless'){
    buffs.harvest=true; buffs.harvestT=BUFF_DUR.bless;
    showToast('You bless the harvest. Food production surges.');
  } else if(key==='fire'){
    buffs.fireAttract=true; buffs.fireAttractT=BUFF_DUR.fire;
    showToast('The fire crackles brighter, drawing villagers near.');
  } else if(key==='gather'){
    let count=0;
    villagers.forEach(v=>{
      if(v.state!=='sleep' && v.state!=='eat' && v.state!=='work' && Math.random()<0.75){
        applyChosenState(v,'fire'); count++;
      }
    });
    showToast('Word spreads through the village. Come to the fire.');
  } else if(key==='quiet'){
    buffs.energyRegen=true; buffs.energyRegenT=BUFF_DUR.quiet;
    showToast('A quiet night settles. Rest comes easier.');
  }
}

function tickAbilities(){
  for(const k in cooldowns){ if(cooldowns[k]>0) cooldowns[k] = Math.max(0,cooldowns[k]-1); }
  if(buffs.harvestT>0){ buffs.harvestT--; if(buffs.harvestT<=0) buffs.harvest=false; }
  if(buffs.fireAttractT>0){ buffs.fireAttractT--; if(buffs.fireAttractT<=0) buffs.fireAttract=false; }
  if(buffs.energyRegenT>0){ buffs.energyRegenT--; if(buffs.energyRegenT<=0) buffs.energyRegen=false; }
  renderAbilityButtons();
}

function renderAbilityButtons(){
  ['bless','fire','gather','quiet'].forEach(k=>{
    const btn = document.getElementById('ab-'+k);
    const cdEl = document.getElementById('ab-'+k+'-cd');
    const fillEl = document.getElementById('ab-'+k+'-fill');
    const cd = cooldowns[k];
    btn.disabled = cd>0;
    cdEl.textContent = cd>0 ? cd+'s' : '';
    fillEl.style.width = cd>0 ? (100 - (cd/CD_MAX[k])*100)+'%' : '0%';
  });
}

/* ---------------------------------------------------------------------
   UI: TOAST
--------------------------------------------------------------------- */
let toastTimer=null;
function showToast(text){
  const el = document.getElementById('toast');
  el.textContent = text;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('show'), 4200);
}

/* ---------------------------------------------------------------------
   UI: TOP STATS
--------------------------------------------------------------------- */
function updateStats(){
  document.getElementById('stat-day').textContent = day;
  document.getElementById('stat-time').textContent = timeString()+' · '+phaseName();
  document.getElementById('stat-food').textContent = food;
  document.getElementById('stat-wood').textContent = wood;
  document.getElementById('stat-pop').textContent = villagers.length;
}

/* ---------------------------------------------------------------------
   UI: CHRONICLE
--------------------------------------------------------------------- */
function renderChronicle(){
  const list = document.getElementById('chron-list');
  list.innerHTML = chronicle.map(e=>
    `<li><span class="day">Day ${e.day} · ${e.time}</span>${escapeHtml(e.text)}</li>`
  ).join('');
}
function escapeHtml(s){
  return s.replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
}

/* ---------------------------------------------------------------------
   UI: CHARACTER CARD
--------------------------------------------------------------------- */
function moodWord(m){
  if(m<20) return 'Miserable';
  if(m<38) return 'Down';
  if(m<55) return 'Content';
  if(m<75) return 'Cheerful';
  return 'Joyful';
}
function stateWord(v){
  const map = {sleep:'Sleeping',eat:'Eating',work:'Working',fire:'By the fire',visit:'Visiting a friend',wander:'Wandering',argue:'In a heated moment'};
  return map[v.state] || '—';
}

function updateCard(){
  const body = document.getElementById('card-body');
  if(selectedId==null){
    body.innerHTML = '<div class="card-empty">Click a villager to learn their story.</div>';
    return;
  }
  const v = villagers.find(x=>x.id===selectedId);
  if(!v){ selectedId=null; body.innerHTML='<div class="card-empty">Click a villager to learn their story.</div>'; return; }

  const fid = bestFriendOf(v);
  const rid = worstRivalOf(v);
  const friendName = fid!=null ? villagers.find(x=>x.id==fid).name : 'None yet';
  const rivalName = rid!=null ? villagers.find(x=>x.id==rid).name : 'None yet';

  const memHtml = v.memories.length
    ? v.memories.map(m=>`<li><span class="tag">Day ${m.day}</span>${escapeHtml(m.text)}</li>`).join('')
    : '<li style="font-style:italic;color:var(--ink-faint);">No memories yet — their story is just beginning.</li>';

  body.innerHTML = `
    <div class="card-name">${v.name}</div>
    <div class="card-sub">${v.archetype} · Age ${v.age} · ${v.occupation}</div>

    <div class="bars">
      <div class="bar-wrap">
        <div class="lbl">Energy</div>
        <div class="bar-track"><div class="bar-fill" style="width:${Math.round(v.energy)}%;background:#7fae7a;"></div></div>
      </div>
      <div class="bar-wrap">
        <div class="lbl">Hunger</div>
        <div class="bar-track"><div class="bar-fill" style="width:${Math.round(v.hunger)}%;background:#c4715a;"></div></div>
      </div>
      <div class="bar-wrap">
        <div class="lbl">Mood</div>
        <div class="bar-track"><div class="bar-fill" style="width:${Math.round(v.moodValue)}%;background:#e0a85e;"></div></div>
      </div>
    </div>

    <div class="card-row"><span class="k">Currently</span><span class="v">${stateWord(v)}</span></div>
    <div class="card-row"><span class="k">Mood</span><span class="v">${moodWord(v.moodValue)}</span></div>
    <div class="card-row"><span class="k">Closest friend</span><span class="v friend">${friendName}</span></div>
    <div class="card-row"><span class="k">Strongest dislike</span><span class="v rival">${rivalName}</span></div>

    <div class="desire-box">Wishes ${escapeHtml(v.desire)}.</div>

    <div class="lbl" style="margin-top:12px;letter-spacing:.09em;color:var(--ink-faint);text-transform:uppercase;font-size:.62rem;">Recent memories</div>
    <ul class="memlist">${memHtml}</ul>
  `;
}

/* ---------------------------------------------------------------------
   CONTROLS
--------------------------------------------------------------------- */
document.getElementById('btn-pause').addEventListener('click', function(){
  paused = !paused;
  this.textContent = paused ? 'Resume' : 'Pause';
  this.classList.toggle('active', paused);
});
function setSpeed(s){
  speed = s;
  ['1','2','4'].forEach(n=>{
    document.getElementById('btn-speed'+n).classList.toggle('active', Number(n)===s);
  });
}
document.getElementById('btn-speed1').addEventListener('click',()=>setSpeed(1));
document.getElementById('btn-speed2').addEventListener('click',()=>setSpeed(2));
document.getElementById('btn-speed4').addEventListener('click',()=>setSpeed(4));
document.getElementById('btn-restart').addEventListener('click',()=>{
  if(confirm("Restart the world? This village's story will be lost.")){
    newVillage();
  }
});
document.getElementById('ab-bless').addEventListener('click',()=>activateAbility('bless'));
document.getElementById('ab-fire').addEventListener('click',()=>activateAbility('fire'));
document.getElementById('ab-gather').addEventListener('click',()=>activateAbility('gather'));
document.getElementById('ab-quiet').addEventListener('click',()=>activateAbility('quiet'));

/* ---------------------------------------------------------------------
   BOOT
--------------------------------------------------------------------- */
newVillage();
setSpeed(1);
setInterval(gameTick, TICK_MS);
setInterval(tickAbilities, 1000);
renderAbilityButtons();

})();
</script>
</body>
</html>
