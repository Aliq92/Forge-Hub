<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Evolution Games — Natural Selection Playground</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="titlebar">
    <h1>Evolution Games <span class="subtitle">— Natural Selection Playground</span></h1>
  </header>

  <main class="layout">
    <section class="stage">
      <canvas id="world" width="900" height="640"></canvas>
    </section>

    <aside class="panel">

      <div class="panel-block">
        <h2>Controls</h2>
        <div class="controls-row">
          <button id="btnPause">Pause</button>
          <button id="btnRestart">Restart</button>
        </div>
        <div class="controls-row">
          <label for="speedSelect">Speed</label>
          <select id="speedSelect">
            <option value="1">1x</option>
            <option value="2">2x</option>
            <option value="5">5x</option>
            <option value="10">10x</option>
          </select>
        </div>
        <div class="controls-row slider-row">
          <label for="mutationSlider">Mutation Rate: <span id="mutationValue">10%</span></label>
          <input type="range" id="mutationSlider" min="0" max="50" value="10" />
        </div>
      </div>

      <div class="panel-block">
        <h2>Statistics</h2>
        <div class="stats-grid">
          <div class="stat"><span class="stat-label">Generation</span><span class="stat-value" id="statGen">1</span></div>
          <div class="stat"><span class="stat-label">Population</span><span class="stat-value" id="statPop">0</span></div>
          <div class="stat"><span class="stat-label">Food Remaining</span><span class="stat-value" id="statFood">0</span></div>
          <div class="stat"><span class="stat-label">Deaths (this gen)</span><span class="stat-value" id="statDeaths">0</span></div>
          <div class="stat"><span class="stat-label">Avg Speed</span><span class="stat-value" id="statSpeed">0</span></div>
          <div class="stat"><span class="stat-label">Avg Vision</span><span class="stat-value" id="statVision">0</span></div>
          <div class="stat"><span class="stat-label">Avg Size</span><span class="stat-value" id="statSize">0</span></div>
          <div class="stat"><span class="stat-label">Avg Efficiency</span><span class="stat-value" id="statEfficiency">0</span></div>
        </div>
      </div>

      <div class="panel-block">
        <h2>Selected Creature</h2>
        <div id="selectedInfo" class="selected-info">
          <p class="muted">Click a creature to inspect its traits.</p>
        </div>
      </div>

      <div class="panel-block panel-log">
        <h2>Event Log</h2>
        <div id="eventLog" class="event-log"></div>
      </div>

    </aside>
  </main>

  <script src="script.js"></script>
</body>
</html>
