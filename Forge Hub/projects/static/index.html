<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Static — a quiet swarm</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #05060f;
    background: radial-gradient(ellipse at center, #0a0d1f 0%, #05060f 70%, #020309 100%);
  }
  canvas {
    display: block;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }
  #hint {
    position: fixed;
    top: max(20px, env(safe-area-inset-top));
    left: 50%;
    transform: translateX(-50%);
    color: rgba(210, 220, 255, 0.55);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 13px;
    font-weight: 400;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    pointer-events: none;
    transition: opacity 2.5s ease;
    text-align: center;
    white-space: nowrap;
  }
  #hint.hidden { opacity: 0; }
  #muteBtn {
    position: fixed;
    top: max(16px, env(safe-area-inset-top));
    right: max(16px, env(safe-area-inset-right));
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1px solid rgba(210, 220, 255, 0.25);
    background: rgba(10, 13, 31, 0.45);
    color: rgba(210, 220, 255, 0.7);
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  #muteBtn:active { background: rgba(10, 13, 31, 0.7); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">tap to ring &middot; hold to gather</div>
<button id="muteBtn" aria-label="Mute sound" title="Mute sound">&#128266;</button>
<script>
(function () {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const hint = document.getElementById('hint');
  const muteBtn = document.getElementById('muteBtn');

  let width = 0, height = 0, dpr = 1;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = Math.floor(width * dpr);
    canvas.height = Math.floor(height * dpr);
    canvas.style.width = width + 'px';
    canvas.style.height = height + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- Tunable parameters ----------
  const MOTE_COUNT = Math.round(Math.min(150, Math.max(70, (width * height) / 9000)));
  const MAX_SPEED = 1.7;
  const MIN_SPEED = 0.25;
  const PERCEPTION = 58;
  const SEPARATION_DIST = 20;
  const COHESION_WEIGHT = 0.006;
  const ALIGNMENT_WEIGHT = 0.045;
  const SEPARATION_WEIGHT = 0.9;
  const WANDER_WEIGHT = 0.05;

  const PULSE_SPEED = 0.30;   // px / ms
  const PULSE_LIFE = 1900;    // ms
  const PULSE_BAND = 38;      // wavefront thickness
  const PUSH_STRENGTH = 0.85;
  const PULL_STRENGTH = 0.055;
  const MAX_PULSES = 10;

  const HOLD_THRESHOLD = 260;   // ms of stillness before a hold starts gathering
  const HOLD_MOVE_CANCEL = 6;   // px of movement that cancels a hold and resumes dragging
  const ATTRACT_RADIUS = 150;
  const ATTRACT_STRENGTH = 0.11;
  const ATTRACT_MIN_DIST = 10;

  const BOND_WEIGHT = 0.008;  // pull toward the rest of a lingering school
  const BOND_DECAY = 0.996;   // per-frame decay of the bond after release
  const BOND_MIN = 0.04;      // below this, the bond dissolves

  // ---------- Motes ----------
  const motes = [];
  function makeMote() {
    return {
      x: Math.random() * width,
      y: Math.random() * height,
      vx: (Math.random() - 0.5) * 0.6,
      vy: (Math.random() - 0.5) * 0.6,
      wanderAngle: Math.random() * Math.PI * 2,
      hue: 185 + Math.random() * 95,        // cyan through violet
      huePhase: Math.random() * Math.PI * 2,
      brightness: 0.35 + Math.random() * 0.15,
      size: 1.3 + Math.random() * 1.4,
      bondGroup: null,     // id of a lingering "school" this mote belongs to, if any
      bondStrength: 0      // 0..1, decays after a gather ends
    };
  }
  for (let i = 0; i < MOTE_COUNT; i++) motes.push(makeMote());

  // ---------- Pulses (rings) ----------
  const pulses = [];
  function spawnPulse(x, y) {
    if (pulses.length >= MAX_PULSES) pulses.shift();
    pulses.push({ x, y, start: performance.now() });
    playChime(x);
  }

  // ---------- Attractors (hold-to-gather) ----------
  // Active while a pointer is held still; pulls nearby motes gently inward.
  const attractors = new Map(); // pointerId -> {x, y, groupId}
  let bondGroupCounter = 0;

  // ---------- Audio (procedural bell chime, one per pulse) ----------
  let audioCtx = null;
  let masterGain = null;
  let muted = false;

  // A gentle pentatonic scale spread across two octaves, mapped left-to-right
  // across the screen so dragging a finger sweeps through notes like a harp.
  const SCALE = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25, 783.99, 880.00];

  function ensureAudio() {
    if (audioCtx) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return;
    }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    audioCtx = new AC();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = 0.32;
    masterGain.connect(audioCtx.destination);
  }

  function playChime(x) {
    if (!audioCtx || muted) return;
    const t0 = audioCtx.currentTime;
    const idx = Math.max(0, Math.min(SCALE.length - 1, Math.floor((x / width) * SCALE.length)));
    const freq = SCALE[idx] * (0.997 + Math.random() * 0.006); // tiny detune, organic feel

    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 3200;
    filter.connect(masterGain);

    // fundamental
    const osc1 = audioCtx.createOscillator();
    osc1.type = 'sine';
    osc1.frequency.value = freq;
    const gain1 = audioCtx.createGain();
    gain1.gain.setValueAtTime(0, t0);
    gain1.gain.linearRampToValueAtTime(0.5, t0 + 0.008);
    gain1.gain.exponentialRampToValueAtTime(0.001, t0 + 1.1);
    osc1.connect(gain1).connect(filter);

    // inharmonic overtone, typical of bell timbres, decays faster
    const osc2 = audioCtx.createOscillator();
    osc2.type = 'sine';
    osc2.frequency.value = freq * 2.76;
    const gain2 = audioCtx.createGain();
    gain2.gain.setValueAtTime(0, t0);
    gain2.gain.linearRampToValueAtTime(0.14, t0 + 0.008);
    gain2.gain.exponentialRampToValueAtTime(0.001, t0 + 0.55);
    osc2.connect(gain2).connect(filter);

    osc1.start(t0); osc2.start(t0);
    osc1.stop(t0 + 1.2); osc2.stop(t0 + 0.6);
  }

  // Sustained soft drone while a hold-to-gather is active, one per pointer.
  const attractorAudio = new Map();

  function startAttractorAudio(id, x) {
    if (!audioCtx || attractorAudio.has(id)) return;
    const idx = Math.max(0, Math.min(SCALE.length - 1, Math.floor((x / width) * SCALE.length)));
    const freq = SCALE[idx] / 2;
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 900;
    filter.connect(masterGain);
    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0, audioCtx.currentTime);
    gain.gain.linearRampToValueAtTime(0.07, audioCtx.currentTime + 0.35);
    gain.connect(filter);
    const osc = audioCtx.createOscillator();
    osc.type = 'sine';
    osc.frequency.value = freq;
    osc.connect(gain);
    osc.start();
    attractorAudio.set(id, { osc, gain });
  }

  function stopAttractorAudio(id) {
    const a = attractorAudio.get(id);
    if (!a || !audioCtx) return;
    const t = audioCtx.currentTime;
    a.gain.gain.cancelScheduledValues(t);
    a.gain.gain.setValueAtTime(a.gain.gain.value, t);
    a.gain.gain.linearRampToValueAtTime(0.0001, t + 0.4);
    a.osc.stop(t + 0.45);
    attractorAudio.delete(id);
  }

  function setMuted(next) {
    muted = next;
    muteBtn.innerHTML = muted ? '&#128263;' : '&#128266;';
    muteBtn.setAttribute('aria-label', muted ? 'Unmute sound' : 'Mute sound');
    if (masterGain && audioCtx) {
      masterGain.gain.setTargetAtTime(muted ? 0 : 0.32, audioCtx.currentTime, 0.05);
    }
  }

  muteBtn.addEventListener('pointerdown', (e) => {
    e.stopPropagation();
    ensureAudio();
    setMuted(!muted);
  });

  // ---------- Pointer handling ----------
  // Two gestures share the same touch point:
  //  - tap / drag  -> discrete ripple pulses (unchanged from v0.2)
  //  - hold still  -> continuous gather (new in v0.3)
  const lastSpawnByPointer = new Map();
  const holdState = new Map(); // pointerId -> {anchorX, anchorY, downTime, attracting}
  const SPAWN_THROTTLE = 140; // ms while dragging

  function hideHint() {
    hint.classList.add('hidden');
  }

  function handlePointer(id, x, y, force) {
    const now = performance.now();
    const last = lastSpawnByPointer.get(id) || 0;
    if (force || now - last > SPAWN_THROTTLE) {
      spawnPulse(x, y);
      lastSpawnByPointer.set(id, now);
      hideHint();
    }
  }

  function beginAttracting(id, x, y) {
    const state = holdState.get(id);
    if (!state || state.attracting) return;
    state.attracting = true;
    attractors.set(id, { x, y, groupId: ++bondGroupCounter });
    startAttractorAudio(id, x);
  }

  function endAttracting(id) {
    if (!attractors.has(id)) return;
    attractors.delete(id);
    stopAttractorAudio(id);
  }

  canvas.addEventListener('pointerdown', (e) => {
    canvas.setPointerCapture(e.pointerId);
    ensureAudio();
    handlePointer(e.pointerId, e.clientX, e.clientY, true);
    holdState.set(e.pointerId, {
      anchorX: e.clientX,
      anchorY: e.clientY,
      downTime: performance.now(),
      attracting: false
    });
  });
  canvas.addEventListener('pointermove', (e) => {
    if (e.buttons === 0 && e.pointerType === 'mouse') return;
    if (e.pressure === 0 && e.pointerType !== 'mouse') return;

    const state = holdState.get(e.pointerId);
    if (!state) return;

    const moved = Math.hypot(e.clientX - state.anchorX, e.clientY - state.anchorY);
    if (moved > HOLD_MOVE_CANCEL) {
      // dragging: reset the hold clock and keep spawning ripples as before
      state.anchorX = e.clientX;
      state.anchorY = e.clientY;
      state.downTime = performance.now();
      if (state.attracting) {
        state.attracting = false;
        endAttracting(e.pointerId);
      }
      handlePointer(e.pointerId, e.clientX, e.clientY, false);
      return;
    }

    if (state.attracting) {
      const existing = attractors.get(e.pointerId);
      attractors.set(e.pointerId, { x: e.clientX, y: e.clientY, groupId: existing ? existing.groupId : ++bondGroupCounter });
    } else if (performance.now() - state.downTime >= HOLD_THRESHOLD) {
      beginAttracting(e.pointerId, e.clientX, e.clientY);
    }
  });
  canvas.addEventListener('pointerup', (e) => {
    lastSpawnByPointer.delete(e.pointerId);
    holdState.delete(e.pointerId);
    endAttracting(e.pointerId);
  });
  canvas.addEventListener('pointercancel', (e) => {
    lastSpawnByPointer.delete(e.pointerId);
    holdState.delete(e.pointerId);
    endAttracting(e.pointerId);
  });

  setTimeout(hideHint, 6000);

  // ---------- Simulation ----------
  function wrapDelta(d, size) {
    if (d > size / 2) d -= size;
    if (d < -size / 2) d += size;
    return d;
  }

  function step(now) {
    // update pulses
    for (let i = pulses.length - 1; i >= 0; i--) {
      if (now - pulses[i].start > PULSE_LIFE) pulses.splice(i, 1);
    }

    // find the current center of each lingering "school" (bonded group of motes)
    const bondCenters = new Map(); // groupId -> {x, y, count}
    for (let i = 0; i < motes.length; i++) {
      const m = motes[i];
      if (m.bondGroup && m.bondStrength > 0) {
        let g = bondCenters.get(m.bondGroup);
        if (!g) { g = { x: 0, y: 0, count: 0 }; bondCenters.set(m.bondGroup, g); }
        g.x += m.x; g.y += m.y; g.count++;
      }
    }
    for (const g of bondCenters.values()) { g.x /= g.count; g.y /= g.count; }

    for (let i = 0; i < motes.length; i++) {
      const m = motes[i];
      let cx = 0, cy = 0, cCount = 0;
      let ax = 0, ay = 0, aCount = 0;
      let sx = 0, sy = 0;

      for (let j = 0; j < motes.length; j++) {
        if (i === j) continue;
        const o = motes[j];
        let dx = wrapDelta(o.x - m.x, width);
        let dy = wrapDelta(o.y - m.y, height);
        const d2 = dx * dx + dy * dy;
        if (d2 < PERCEPTION * PERCEPTION && d2 > 0.0001) {
          cx += dx; cy += dy; cCount++;
          ax += o.vx; ay += o.vy; aCount++;
          if (d2 < SEPARATION_DIST * SEPARATION_DIST) {
            sx -= dx / d2;
            sy -= dy / d2;
          }
        }
      }

      let accX = 0, accY = 0;
      if (cCount > 0) {
        cx /= cCount; cy /= cCount;
        accX += cx * COHESION_WEIGHT;
        accY += cy * COHESION_WEIGHT;
      }
      if (aCount > 0) {
        ax /= aCount; ay /= aCount;
        accX += (ax - m.vx) * ALIGNMENT_WEIGHT;
        accY += (ay - m.vy) * ALIGNMENT_WEIGHT;
      }
      accX += sx * SEPARATION_WEIGHT;
      accY += sy * SEPARATION_WEIGHT;

      // wander
      m.wanderAngle += (Math.random() - 0.5) * 0.5;
      accX += Math.cos(m.wanderAngle) * WANDER_WEIGHT;
      accY += Math.sin(m.wanderAngle) * WANDER_WEIGHT;

      // pulse forces
      for (let p = 0; p < pulses.length; p++) {
        const pulse = pulses[p];
        const age = now - pulse.start;
        const life = age / PULSE_LIFE; // 0..1
        const ringR = age * PULSE_SPEED;
        let dx = m.x - pulse.x;
        let dy = m.y - pulse.y;
        const d = Math.sqrt(dx * dx + dy * dy) || 0.0001;
        const diff = d - ringR;

        if (Math.abs(diff) < PULSE_BAND) {
          const falloff = 1 - Math.abs(diff) / PULSE_BAND;
          const strength = PUSH_STRENGTH * (1 - life) * falloff;
          accX += (dx / d) * strength;
          accY += (dy / d) * strength;
          m.brightness = Math.max(m.brightness, 1);
        } else if (diff < 0 && d > 14) {
          const strength = PULL_STRENGTH * (1 - life);
          accX -= (dx / d) * strength;
          accY -= (dy / d) * strength;
        }
      }

      // attractor (hold-to-gather) forces
      if (attractors.size > 0) {
        for (const att of attractors.values()) {
          const dx = att.x - m.x;
          const dy = att.y - m.y;
          const d = Math.sqrt(dx * dx + dy * dy) || 0.0001;
          if (d < ATTRACT_RADIUS && d > ATTRACT_MIN_DIST) {
            const strength = ATTRACT_STRENGTH * (1 - d / ATTRACT_RADIUS);
            accX += (dx / d) * strength;
            accY += (dy / d) * strength;
            m.brightness = Math.max(m.brightness, 0.6);
            m.bondGroup = att.groupId;
            m.bondStrength = 1;
          }
        }
      }

      // lingering school: motes gathered together in the same session keep
      // drifting toward each other for a while after the hold ends
      if (m.bondGroup) {
        const center = bondCenters.get(m.bondGroup);
        if (center && center.count > 1) {
          const dx = center.x - m.x;
          const dy = center.y - m.y;
          const d = Math.sqrt(dx * dx + dy * dy) || 0.0001;
          const pull = Math.min(d, 120) * BOND_WEIGHT * m.bondStrength;
          accX += (dx / d) * pull;
          accY += (dy / d) * pull;
        }
        m.bondStrength *= BOND_DECAY;
        if (m.bondStrength < BOND_MIN) {
          m.bondStrength = 0;
          m.bondGroup = null;
        }
      }

      m.vx += accX;
      m.vy += accY;

      const speed = Math.hypot(m.vx, m.vy);
      if (speed > MAX_SPEED) {
        m.vx = (m.vx / speed) * MAX_SPEED;
        m.vy = (m.vy / speed) * MAX_SPEED;
      } else if (speed < MIN_SPEED) {
        if (speed < 0.0001) {
          m.vx = (Math.random() - 0.5) * MIN_SPEED;
          m.vy = (Math.random() - 0.5) * MIN_SPEED;
        } else {
          m.vx = (m.vx / speed) * MIN_SPEED;
          m.vy = (m.vy / speed) * MIN_SPEED;
        }
      }

      m.x += m.vx;
      m.y += m.vy;

      if (m.x < 0) m.x += width;
      if (m.x > width) m.x -= width;
      if (m.y < 0) m.y += height;
      if (m.y > height) m.y -= height;

      m.brightness *= 0.945;
      if (m.brightness < 0.32) m.brightness = 0.32;
    }
  }

  function render(now) {
    // trailing fade
    ctx.fillStyle = 'rgba(4, 6, 16, 0.16)';
    ctx.fillRect(0, 0, width, height);

    // pulses
    for (let p = 0; p < pulses.length; p++) {
      const pulse = pulses[p];
      const age = now - pulse.start;
      const life = age / PULSE_LIFE;
      if (life > 1) continue;
      const r = age * PULSE_SPEED;
      const alpha = (1 - life) * 0.35;
      ctx.beginPath();
      ctx.arc(pulse.x, pulse.y, Math.max(r, 0), 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(190, 220, 255, ${alpha})`;
      ctx.lineWidth = 1.4;
      ctx.stroke();
    }

    // attractors (warm gathering halo)
    if (attractors.size > 0) {
      const pulse = 6 * Math.sin(now * 0.006);
      for (const att of attractors.values()) {
        const r = 34 + pulse;
        const grad = ctx.createRadialGradient(att.x, att.y, 0, att.x, att.y, r);
        grad.addColorStop(0, 'rgba(255, 210, 140, 0.30)');
        grad.addColorStop(1, 'rgba(255, 210, 140, 0)');
        ctx.beginPath();
        ctx.arc(att.x, att.y, r, 0, Math.PI * 2);
        ctx.fillStyle = grad;
        ctx.fill();
      }
    }

    // motes
    for (let i = 0; i < motes.length; i++) {
      const m = motes[i];
      const hue = m.hue + Math.sin(now * 0.0002 + m.huePhase) * 12;
      const b = m.brightness;
      const r = m.size * (0.9 + b * 0.6);

      ctx.beginPath();
      ctx.arc(m.x, m.y, r, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${hue}, 85%, ${55 + b * 20}%, ${0.55 + b * 0.4})`;
      ctx.shadowColor = `hsla(${hue}, 90%, 65%, ${0.6 * b})`;
      ctx.shadowBlur = 6 + b * 10;
      ctx.fill();
    }
    ctx.shadowBlur = 0;
  }

  function loop(now) {
    step(now);
    render(now);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
