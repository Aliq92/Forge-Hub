<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>WORLDSEED — Procedural Civilization Sandbox</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <header id="topPanel">
    <h1>WORLDSEED</h1>
    <div class="stats">
      <div class="stat"><span class="label">Pop</span><span id="statPop">0</span></div>
      <div class="stat"><span class="label">Food</span><span id="statFood">0</span></div>
      <div class="stat"><span class="label">Wood</span><span id="statWood">0</span></div>
      <div class="stat"><span class="label">Stone</span><span id="statStone">0</span></div>
      <div class="stat"><span class="label">Houses</span><span id="statHouses">0</span></div>
      <div class="stat"><span class="label">Year</span><span id="statYear">1</span></div>
      <div class="stat"><span class="label">Day</span><span id="statDay">1</span></div>
    </div>
    <div class="simControls">
      <button id="btnPause">Pause</button>
      <button id="btnSpeed1" class="speedBtn active">1x</button>
      <button id="btnSpeed2" class="speedBtn">2x</button>
      <button id="btnSpeed4" class="speedBtn">4x</button>
      <button id="btnReset">Reset World</button>
    </div>
  </header>

  <main id="gameArea">
    <canvas id="worldCanvas"></canvas>
  </main>

  <footer id="toolbar">
    <button class="tool" data-tool="spawnHuman" title="Click the world to spawn a human">
      <span class="icon">🧍</span><span class="toolLabel">Spawn Human</span>
    </button>
    <button class="tool" data-tool="growForest" title="Click the world to grow trees">
      <span class="icon">🌲</span><span class="toolLabel">Grow Forest</span>
    </button>
    <button class="tool" data-tool="rain" title="Click anywhere to trigger rain">
      <span class="icon">🌧️</span><span class="toolLabel">Rain</span>
    </button>
    <button class="tool" data-tool="lightning" title="Click the world to strike lightning">
      <span class="icon">⚡</span><span class="toolLabel">Lightning</span>
    </button>
    <button class="tool" data-tool="fire" title="Click the world to start a fire">
      <span class="icon">🔥</span><span class="toolLabel">Fire</span>
    </button>
    <button class="tool" data-tool="none" id="btnCancelTool" title="Deselect tool">
      <span class="icon">✋</span><span class="toolLabel">Cancel</span>
    </button>
  </footer>

  <script src="js/world.js"></script>
  <script src="js/human.js"></script>
  <script src="js/settlement.js"></script>
  <script src="js/effects.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
