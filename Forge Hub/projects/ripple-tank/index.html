<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ripple Tank</title>
<style>
  :root{
    --void:#060a12;
    --frame-1:#2b3648;
    --frame-2:#4a5872;
    --trough:#160a30;
    --calm:#12283f;
    --crest:#d9fbff;
    --wall:#6b7280;
    --wall-hi:#9aa4b2;
    --ink:#e8f1f7;
    --muted:#7c93a8;
    --accent:#5eead4;
    --panel:rgba(8,16,28,0.82);
    --panel-border:rgba(255,255,255,0.09);
    --danger:#ff8a7a;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    overflow:hidden; background:var(--void);
    -webkit-tap-highlight-color:transparent;
    user-select:none;
  }
  #stage{ position:fixed; inset:0; width:100%; height:100%; touch-action:none; }
  canvas{ display:block; width:100%; height:100%; }

  /* ---------- Title plate ---------- */
  #title{
    position:fixed; top:16px; left:16px; z-index:10;
    pointer-events:none;
    transition:opacity 1s ease;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;
  }
  #title h1{
    margin:0; font-size:15px; font-weight:700; letter-spacing:0.16em;
    color:var(--ink); text-transform:uppercase;
    text-shadow:0 0 14px rgba(94,234,212,0.35);
  }
  #title p{
    margin:3px 0 0; font-size:10px; letter-spacing:0.08em;
    color:var(--muted); text-transform:uppercase;
    font-family:'SFMono-Regular',Menlo,Consolas,monospace;
  }
  #title.dim{ opacity:0.4; }

  /* ---------- Readout ---------- */
  #readout{
    position:fixed; top:16px; right:16px; z-index:10;
    font-family:'SFMono-Regular',Menlo,Consolas,monospace;
    color:var(--ink); text-align:right;
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:8px;
    padding:8px 11px;
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    font-size:11px;
    line-height:1.65;
    min-width:118px;
  }
  #readout .lbl{ color:var(--muted); margin-right:6px; }
  #readout .val{ color:var(--accent); }

  /* ---------- Hint ---------- */
  #hint{
    position:fixed; left:50%; top:16px; transform:translateX(-50%);
    z-index:10; pointer-events:none;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;
    font-size:11px; color:var(--muted);
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:20px;
    padding:6px 14px;
    transition:opacity 0.8s ease;
    white-space:nowrap;
  }
  #hint.dim{ opacity:0; }

  /* ---------- Control panel ---------- */
  #panel{
    position:fixed; z-index:20;
    background:var(--panel);
    border:1px solid var(--panel-border);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;
    color:var(--ink);
    display:flex;
    gap:10px;
  }
  .grp{ display:flex; flex-direction:column; gap:6px; }
  .grp-label{
    font-size:9px; letter-spacing:0.1em; color:var(--muted);
    text-transform:uppercase; font-weight:600;
  }
  .seg{ display:flex; border-radius:8px; overflow:hidden; border:1px solid var(--panel-border); }
  .seg button{
    flex:1; border:none; background:transparent; color:var(--muted);
    font-size:12px; font-weight:600; padding:8px 10px; cursor:pointer;
    font-family:inherit;
  }
  .seg button.active{ background:var(--accent); color:#03211d; }
  .btn{
    border:1px solid var(--panel-border); background:rgba(255,255,255,0.04);
    color:var(--ink); font-size:12px; font-weight:600; padding:8px 12px;
    border-radius:8px; cursor:pointer; font-family:inherit; white-space:nowrap;
  }
  .btn:active{ background:rgba(255,255,255,0.1); }
  .btn.preset{ background:rgba(94,234,212,0.14); border-color:rgba(94,234,212,0.35); color:var(--accent); }
  .btn.warn{ color:var(--danger); }
  .btn.wide{ width:100%; }
  .row{ display:flex; gap:8px; }
  #slidewrap{ display:flex; align-items:center; gap:8px; }
  #freqSlider{ -webkit-appearance:none; appearance:none; width:100%; height:4px;
    border-radius:2px; background:rgba(255,255,255,0.15); outline:none; }
  #freqSlider::-webkit-slider-thumb{ -webkit-appearance:none; appearance:none;
    width:15px; height:15px; border-radius:50%; background:var(--accent); cursor:pointer; }
  #freqSlider::-moz-range-thumb{ width:15px; height:15px; border-radius:50%;
    background:var(--accent); border:none; cursor:pointer; }
  #freqVal{ font-family:'SFMono-Regular',Menlo,Consolas,monospace; font-size:11px;
    color:var(--accent); width:34px; text-align:right; }

  /* Wide / landscape: right rail */
  @media (min-width:681px), (min-aspect-ratio:1/1){
    #panel{
      top:16px; right:16px; bottom:16px; width:186px;
      border-radius:14px; padding:14px;
      flex-direction:column; overflow-y:auto;
      margin-top:64px;
    }
    #readout{ top:16px; right:214px; }
  }

  /* Narrow / portrait: bottom sheet */
  @media (max-width:680px) and (max-aspect-ratio:0.999){
    #panel{
      left:0; right:0; bottom:0; width:100%;
      border-radius:16px 16px 0 0; padding:10px 12px calc(10px + env(safe-area-inset-bottom));
      flex-direction:row; overflow-x:auto; align-items:flex-end;
    }
    .grp{ min-width:104px; flex:0 0 auto; }
    #slidewrap{ min-width:120px; }
    #readout{ top:auto; bottom:calc(112px + env(safe-area-inset-bottom)); right:16px; }
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="tank"></canvas>
</div>

<div id="title">
  <h1>Ripple Tank</h1>
  <p>Wave Interference Apparatus</p>
</div>

<div id="hint">Tap the water to begin</div>

<div id="readout">
  <div><span class="lbl">MODE</span><span class="val" id="roMode">DROP</span></div>
  <div><span class="lbl">SOURCES</span><span class="val" id="roSources">0</span></div>
  <div><span class="lbl">FREQ</span><span class="val" id="roFreq">0.09</span></div>
</div>

<div id="panel">
  <div class="grp">
    <div class="grp-label">Mode</div>
    <div class="seg">
      <button class="modeBtn active" data-mode="drop">Drop</button>
      <button class="modeBtn" data-mode="source">Source</button>
      <button class="modeBtn" data-mode="wall">Wall</button>
    </div>
  </div>

  <div class="grp">
    <div class="grp-label">Frequency</div>
    <div id="slidewrap">
      <input type="range" id="freqSlider" min="3" max="26" value="9" step="1">
      <span id="freqVal">0.09</span>
    </div>
  </div>

  <div class="grp">
    <div class="grp-label">Preset</div>
    <button class="btn preset wide" id="presetBtn">Double-Slit</button>
  </div>

  <div class="grp">
    <div class="grp-label">Playback</div>
    <div class="row">
      <button class="btn" id="pauseBtn">Pause</button>
      <button class="btn" id="speedBtn">1x</button>
    </div>
  </div>

  <div class="grp">
    <div class="grp-label">Reset</div>
    <div class="row">
      <button class="btn warn" id="eraseWallsBtn">Erase Walls</button>
      <button class="btn warn" id="clearBtn">Clear All</button>
    </div>
  </div>
</div>

<script>
(function(){
  'use strict';

  var canvas = document.getElementById('tank');
  var ctx = canvas.getContext('2d');
  var simCanvas = document.createElement('canvas');
  var simCtx = simCanvas.getContext('2d');

  var dpr = Math.max(1, Math.min(3, window.devicePixelRatio || 1));
  var viewW = 0, viewH = 0;
  var cellPx = 6;
  var cols = 0, rows = 0;
  var tankOffX = 0, tankOffY = 0, tankWpx = 0, tankHpx = 0;

  var bufA = null, bufB = null, barrier = null, dampField = null;
  var curIsA = true; // which buffer holds the latest computed frame
  var waveT = 0;

  var sources = []; // {col,row,phase}
  var MAX_SOURCES = 6;
  var freq = 0.09;
  var AMPLITUDE_SOURCE = 1.0;
  var AMPLITUDE_DROP = 3.2;
  var HEIGHT_NORM = 1.5;
  var EDGE_BAND = 14;
  var INTERIOR_DAMP = 0.996;
  var EDGE_DAMP = 0.86;

  var mode = 'drop'; // drop | source | wall
  var paused = false;
  var stepsPerFrame = 1;
  var pointerDown = false;
  var lastDropAt = 0;
  var lastWallCell = -1;
  var hintShown = true;

  var simImg = null; // ImageData

  // ---------- colors (parsed once) ----------
  function hex2rgb(h){
    h = h.replace('#','');
    return [parseInt(h.substr(0,2),16), parseInt(h.substr(2,2),16), parseInt(h.substr(4,2),16)];
  }
  var C_TROUGH = hex2rgb('160a30');
  var C_CALM   = hex2rgb('12283f');
  var C_CREST  = hex2rgb('d9fbff');
  var C_WALL   = hex2rgb('6b7280');

  function lerp(a,b,t){ return a + (b-a)*t; }

  // ---------- grid setup ----------
  function initGrids(){
    var n = cols*rows;
    bufA = new Float32Array(n);
    bufB = new Float32Array(n);
    barrier = new Uint8Array(n);
    dampField = new Float32Array(n);
    curIsA = true;
    waveT = 0;
    sources = [];

    for (var r=0; r<rows; r++){
      for (var c=0; c<cols; c++){
        var idx = r*cols+c;
        var distEdge = Math.min(c, cols-1-c, r, rows-1-r);
        var d;
        if (distEdge >= EDGE_BAND) d = INTERIOR_DAMP;
        else {
          var t = distEdge / EDGE_BAND;
          d = lerp(EDGE_DAMP, INTERIOR_DAMP, t);
        }
        dampField[idx] = d;
      }
    }

    simCanvas.width = cols;
    simCanvas.height = rows;
    simImg = simCtx.createImageData(cols, rows);
    updateReadout();
  }

  function resize(){
    viewW = window.innerWidth;
    viewH = window.innerHeight;
    dpr = Math.max(1, Math.min(3, window.devicePixelRatio || 1));

    canvas.width = Math.round(viewW*dpr);
    canvas.height = Math.round(viewH*dpr);
    canvas.style.width = viewW+'px';
    canvas.style.height = viewH+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.imageSmoothingEnabled = true;

    cellPx = Math.max(4, Math.ceil(viewW/220));
    cellPx = Math.max(cellPx, Math.ceil(viewH/140));
    cols = Math.max(40, Math.floor(viewW/cellPx));
    rows = Math.max(40, Math.floor(viewH/cellPx));
    tankWpx = cols*cellPx;
    tankHpx = rows*cellPx;
    tankOffX = Math.floor((viewW - tankWpx)/2);
    tankOffY = Math.floor((viewH - tankHpx)/2);

    initGrids();
  }

  // ---------- physics ----------
  function addImpulse(col, row, amp){
    var buf = curIsA ? bufA : bufB;
    var kernel = [[0,0,1.0],[-1,0,0.5],[1,0,0.5],[0,-1,0.5],[0,1,0.5]];
    for (var k=0;k<kernel.length;k++){
      var cc = col+kernel[k][0], rr = row+kernel[k][1];
      if (cc<1||cc>=cols-1||rr<1||rr>=rows-1) continue;
      var idx = rr*cols+cc;
      if (barrier[idx]) continue;
      buf[idx] += amp*kernel[k][2];
    }
  }

  function paintWall(col, row){
    if (col<1||col>=cols-1||row<1||row>=rows-1) return;
    var idx = row*cols+col;
    barrier[idx] = 1;
    bufA[idx] = 0; bufB[idx] = 0;
  }

  function step(){
    var old = curIsA ? bufA : bufB;
    var nxt = curIsA ? bufB : bufA;
    var W = cols, H = rows;

    for (var r=1; r<H-1; r++){
      var rowBase = r*W;
      for (var c=1; c<W-1; c++){
        var idx = rowBase + c;
        if (barrier[idx]){ nxt[idx] = 0; continue; }
        var v = (old[idx-1] + old[idx+1] + old[idx-W] + old[idx+W]) * 0.5 - nxt[idx];
        nxt[idx] = v * dampField[idx];
      }
    }
    // hard absorbing outer border
    for (var c2=0;c2<W;c2++){ nxt[c2]=0; nxt[(H-1)*W+c2]=0; }
    for (var r2=0;r2<H;r2++){ nxt[r2*W]=0; nxt[r2*W+(W-1)]=0; }

    // driven sources override
    for (var s=0;s<sources.length;s++){
      var src = sources[s];
      var idxS = src.row*W + src.col;
      if (!barrier[idxS]){
        nxt[idxS] = Math.sin(waveT*freq + src.phase) * AMPLITUDE_SOURCE;
      }
    }

    curIsA = !curIsA;
    waveT += 1;
  }

  // ---------- render ----------
  function render(){
    var cur = curIsA ? bufA : bufB;
    var data = simImg.data;
    var n = cols*rows;
    for (var i=0, p=0; i<n; i++, p+=4){
      if (barrier[i]){
        data[p]=C_WALL[0]; data[p+1]=C_WALL[1]; data[p+2]=C_WALL[2]; data[p+3]=255;
        continue;
      }
      var h = cur[i];
      var t = h / HEIGHT_NORM;
      if (t>1) t=1; else if (t<-1) t=-1;
      var r,g,b;
      if (t < 0){
        var tt = t + 1; // 0..1
        r = lerp(C_TROUGH[0], C_CALM[0], tt);
        g = lerp(C_TROUGH[1], C_CALM[1], tt);
        b = lerp(C_TROUGH[2], C_CALM[2], tt);
      } else {
        r = lerp(C_CALM[0], C_CREST[0], t);
        g = lerp(C_CALM[1], C_CREST[1], t);
        b = lerp(C_CALM[2], C_CREST[2], t);
      }
      data[p]=r; data[p+1]=g; data[p+2]=b; data[p+3]=255;
    }
    simCtx.putImageData(simImg, 0, 0);

    ctx.clearRect(0,0,viewW,viewH);

    // frame rim
    var rim = 9;
    var gx0 = tankOffX-rim, gy0 = tankOffY-rim, gw = tankWpx+rim*2, gh = tankHpx+rim*2;
    var grad = ctx.createLinearGradient(gx0,gy0,gx0,gy0+gh);
    grad.addColorStop(0, '#4a5872');
    grad.addColorStop(1, '#232c3b');
    ctx.fillStyle = grad;
    roundRect(gx0,gy0,gw,gh,14);
    ctx.fill();
    ctx.fillStyle = '#080d16';
    roundRect(tankOffX-2, tankOffY-2, tankWpx+4, tankHpx+4, 6);
    ctx.fill();

    // water image scaled up, softened
    ctx.drawImage(simCanvas, 0,0, cols, rows, tankOffX, tankOffY, tankWpx, tankHpx);

    // corner bolts
    ctx.fillStyle = 'rgba(255,255,255,0.18)';
    var bo = 6;
    drawBolt(gx0+bo, gy0+bo); drawBolt(gx0+gw-bo, gy0+bo);
    drawBolt(gx0+bo, gy0+gh-bo); drawBolt(gx0+gw-bo, gy0+gh-bo);

    // source markers
    for (var s=0;s<sources.length;s++){
      var src = sources[s];
      var cx = tankOffX + (src.col+0.5)*cellPx;
      var cy = tankOffY + (src.row+0.5)*cellPx;
      var pulse = 0.5 + 0.5*Math.sin(waveT*freq + src.phase);
      ctx.beginPath();
      ctx.arc(cx, cy, 4 + pulse*2, 0, Math.PI*2);
      ctx.fillStyle = 'rgba(94,234,212,' + (0.35+pulse*0.4).toFixed(2) + ')';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(cx, cy, 2.5, 0, Math.PI*2);
      ctx.fillStyle = '#5eead4';
      ctx.fill();
    }
  }

  function drawBolt(x,y){
    ctx.beginPath();
    ctx.arc(x,y,2.2,0,Math.PI*2);
    ctx.fill();
  }

  function roundRect(x,y,w,h,rad){
    ctx.beginPath();
    ctx.moveTo(x+rad,y);
    ctx.arcTo(x+w,y,x+w,y+h,rad);
    ctx.arcTo(x+w,y+h,x,y+h,rad);
    ctx.arcTo(x,y+h,x,y,rad);
    ctx.arcTo(x,y,x+w,y,rad);
    ctx.closePath();
  }

  // ---------- main loop ----------
  function tick(){
    if (!paused){
      for (var k=0;k<stepsPerFrame;k++) step();
    }
    render();
    requestAnimationFrame(tick);
  }

  // ---------- input ----------
  function localCoords(e){
    var x = (e.clientX !== undefined) ? e.clientX : 0;
    var y = (e.clientY !== undefined) ? e.clientY : 0;
    return { x:x, y:y };
  }

  function cellFromPoint(x,y){
    var col = Math.floor((x - tankOffX)/cellPx);
    var row = Math.floor((y - tankOffY)/cellPx);
    if (col<0||col>=cols||row<0||row>=rows) return null;
    return {col:col,row:row};
  }

  function dismissHint(){
    if (hintShown){
      hintShown = false;
      document.getElementById('hint').classList.add('dim');
      document.getElementById('title').classList.add('dim');
    }
  }

  function toggleSourceAt(col,row){
    for (var i=0;i<sources.length;i++){
      var s = sources[i];
      var dc = s.col-col, dr = s.row-row;
      if (Math.sqrt(dc*dc+dr*dr) <= 3){
        sources.splice(i,1);
        updateReadout();
        return;
      }
    }
    if (sources.length >= MAX_SOURCES) return;
    sources.push({col:col, row:row, phase: Math.random()*Math.PI*2});
    updateReadout();
  }

  function onPointerDown(e){
    dismissHint();
    pointerDown = true;
    var pt = localCoords(e);
    var cell = cellFromPoint(pt.x, pt.y);
    if (!cell) return;
    handleCellAction(cell, true);
  }

  function onPointerMove(e){
    if (!pointerDown) return;
    var pt = localCoords(e);
    var cell = cellFromPoint(pt.x, pt.y);
    if (!cell) return;
    handleCellAction(cell, false);
  }

  function onPointerUp(){
    pointerDown = false;
    lastWallCell = -1;
  }

  function handleCellAction(cell, isDown){
    if (mode === 'drop'){
      var now = performance.now();
      if (isDown || now - lastDropAt > 90){
        addImpulse(cell.col, cell.row, AMPLITUDE_DROP);
        lastDropAt = now;
      }
    } else if (mode === 'source'){
      if (isDown) toggleSourceAt(cell.col, cell.row);
    } else if (mode === 'wall'){
      var key = cell.row*cols+cell.col;
      if (key !== lastWallCell){
        paintWall(cell.col, cell.row);
        lastWallCell = key;
        updateReadout();
      }
    }
  }

  canvas.addEventListener('pointerdown', function(e){ canvas.setPointerCapture(e.pointerId); onPointerDown(e); });
  canvas.addEventListener('pointermove', onPointerMove);
  canvas.addEventListener('pointerup', onPointerUp);
  canvas.addEventListener('pointercancel', onPointerUp);
  canvas.addEventListener('contextmenu', function(e){ e.preventDefault(); });

  // ---------- controls ----------
  var modeBtns = document.querySelectorAll('.modeBtn');
  for (var mb=0; mb<modeBtns.length; mb++){
    modeBtns[mb].addEventListener('click', function(e){
      for (var j=0;j<modeBtns.length;j++) modeBtns[j].classList.remove('active');
      e.target.classList.add('active');
      mode = e.target.getAttribute('data-mode');
      updateReadout();
    });
  }

  var freqSlider = document.getElementById('freqSlider');
  var freqVal = document.getElementById('freqVal');
  freqSlider.addEventListener('input', function(){
    freq = parseInt(freqSlider.value,10) / 100;
    freqVal.textContent = freq.toFixed(2);
    updateReadout();
  });

  document.getElementById('pauseBtn').addEventListener('click', function(e){
    paused = !paused;
    e.target.textContent = paused ? 'Play' : 'Pause';
  });

  document.getElementById('speedBtn').addEventListener('click', function(e){
    stepsPerFrame = (stepsPerFrame === 1) ? 2 : 1;
    e.target.textContent = stepsPerFrame + 'x';
  });

  document.getElementById('eraseWallsBtn').addEventListener('click', function(){
    barrier.fill(0);
  });

  document.getElementById('clearBtn').addEventListener('click', function(){
    bufA.fill(0); bufB.fill(0); barrier.fill(0);
    sources = [];
    waveT = 0;
    updateReadout();
  });

  document.getElementById('presetBtn').addEventListener('click', function(){
    dismissHint();
    bufA.fill(0); bufB.fill(0); barrier.fill(0);
    sources = [];
    waveT = 0;

    var wallCol = Math.floor(cols*0.42);
    var gapH = Math.max(3, Math.round(rows*0.05));
    var gap1Center = Math.round(rows*0.38);
    var gap2Center = Math.round(rows*0.62);
    for (var r=1; r<rows-1; r++){
      var inGap1 = Math.abs(r-gap1Center) <= gapH;
      var inGap2 = Math.abs(r-gap2Center) <= gapH;
      if (!inGap1 && !inGap2) paintWall(wallCol, r);
    }
    sources.push({ col: Math.floor(cols*0.14), row: Math.floor(rows/2), phase: 0 });

    paused = false;
    document.getElementById('pauseBtn').textContent = 'Pause';
    updateReadout();
  });

  function updateReadout(){
    document.getElementById('roMode').textContent = mode.toUpperCase();
    document.getElementById('roSources').textContent = sources.length;
    document.getElementById('roFreq').textContent = freq.toFixed(2);
  }

  // ---------- boot ----------
  var resizeTimer = null;
  window.addEventListener('resize', function(){
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(resize, 150);
  });

  resize();
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
