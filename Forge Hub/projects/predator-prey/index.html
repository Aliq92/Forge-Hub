<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Predator&ndash;Prey Simulation</title>
  <link rel="stylesheet" href="styles/main.css" />
</head>
<body>
  <canvas id="simulation-canvas"></canvas>

  <div id="hud" class="panel">
    <div class="hud-row"><span class="dot dot-prey"></span>Prey: <strong id="stat-prey">0</strong></div>
    <div class="hud-row"><span class="dot dot-predator"></span>Predators: <strong id="stat-predator">0</strong></div>
    <div class="hud-row"><span class="dot dot-food"></span>Food: <strong id="stat-food">0</strong></div>
    <div class="hud-row">Elapsed: <strong id="stat-time">0s</strong></div>
    <div class="hud-row">FPS: <strong id="stat-fps">0</strong></div>
  </div>

  <div id="controls" class="panel">
    <div class="controls-row">
      <button id="btn-pause" class="btn">Pause</button>
      <button id="btn-restart" class="btn">Restart</button>
    </div>
    <div class="controls-row">
      <span class="controls-label">Speed</span>
      <button class="btn speed-btn" data-speed="0.5">0.5x</button>
      <button class="btn speed-btn active" data-speed="1">1x</button>
      <button class="btn speed-btn" data-speed="2">2x</button>
      <button class="btn speed-btn" data-speed="4">4x</button>
    </div>
  </div>

  <div id="extinction-banner" class="panel hidden"></div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
