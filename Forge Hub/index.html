<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FORGE HUB</title>
  <meta name="description" content="Experimental worlds, simulations and tools from Project FORGE." />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div class="grid-backdrop" aria-hidden="true"></div>

  <header class="site-header">
    <div class="header-inner">
      <h1 class="brand">FORGE</h1>
      <p class="subtitle">Experimental Worlds, Simulations &amp; Tools</p>
      <p class="intro-stats" id="intro-stats">Loading build registry…</p>
    </div>
  </header>

  <main class="site-main">
    <section class="featured" aria-label="Latest build">
      <div class="featured-grid" id="featured-slot">
        <!-- Featured project card is generated by app.js -->
      </div>
    </section>

    <section class="filters" aria-label="Project category filters">
      <button class="filter-btn is-active" data-filter="all">ALL</button>
      <button class="filter-btn" data-filter="simulation">SIMULATIONS</button>
      <button class="filter-btn" data-filter="game">GAMES</button>
      <button class="filter-btn" data-filter="tool">TOOLS</button>
      <button class="filter-btn" data-filter="experiment">EXPERIMENTS</button>
    </section>

    <section class="project-grid" id="project-grid" aria-live="polite">
      <!-- Project cards are generated by app.js from the project registry -->
    </section>

    <p class="empty-state" id="empty-state" hidden>No projects in this category yet.</p>
  </main>

  <footer class="site-footer">
    <p class="footer-title">PROJECT FORGE</p>
    <p class="footer-tagline">Build. Test. Keep what survives.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
